[project]
name = "trainingsmethoden-katalog"
version = "0.1.0"
description = "Katalog didaktischer Methoden für Trainer:innen (Präsenz / Remote / Hybrid)"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "pydantic>=2.6,<3.0",
  "pyyaml>=6.0,<7.0",
  "python-slugify>=8.0,<9.0",
  "typer>=0.12,<1.0",
  "python-dotenv>=1.0,<2.0",
  "rich>=13.7,<14.0",
  "pgvector>=0.3,<1.0",
  # numpy für Snapshot-Mode (In-Memory-Embeddings). Wird auch im
  # Postgres-Mode harmlos mitinstalliert — die ~30 MB sind das wert,
  # um zwei separate Image-Varianten zu vermeiden.
  "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.4",
  "pytest>=8.0",
]
api = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
]
embed = [
  "openai>=1.30,<2.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
methods = "methods.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

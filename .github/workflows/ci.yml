# CI je Push auf main und je Pull Request (KSM-2, KSP-66 / MK-1).
# Vier Gates ohne Datenbank: ruff, compileall, YAML-Schema-Prüfung, pytest.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Abhängigkeiten
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,api]"
      - name: ruff
        run: python -m ruff check .
      - name: compileall
        run: python -m compileall -q src alembic scripts
      - name: YAML-Schema (data/methods)
        run: python scripts/verify_yamls.py
      - name: pytest
        run: python -m pytest tests -q

slug: symbol-abschluss
canonical_name: Symbol-Abschluss
synonyms:
  - synonym: Symbolic Closing
    language: en
short_description: >
  TN wählen aus einer Auslage von Gegenständen (Steine, Muscheln, Karten,
  Figuren) eins aus, das ihren aktuellen Zustand oder ihre wichtigste
  Erkenntnis symbolisiert, und teilen kurz, warum. Nonverbale Brücke zur
  Abschlussreflexion.

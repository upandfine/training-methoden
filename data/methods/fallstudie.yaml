slug: fallstudie
canonical_name: Fallstudie
synonyms:
  - synonym: Case Study
    language: en
  - synonym: Fallarbeit
    language: de
short_description: >
  Teilnehmende analysieren einen realen oder konstruierten Fall mit Daten,
  Zusammenhängen, Entscheidungsdilemma. Meist in Gruppen; Ergebnis ist eine
  begründete Entscheidung oder Empfehlung.
originator: Harvard Business School (Case Method)
origin_year: 1922
origin_context: >
  Case-Method der Harvard Business School seit 1920ern; heute in Managementausbildung,
  Jura, Medizin, Beratung verbreitet.

steps:
  - order: 1
    label: Unterlagen weg, Auftrag geben
    duration_minutes: 1
    trainer_action: >
      „Unterlagen und Folien bitte zu. Schreiben Sie aus dem Gedächtnis
      die drei wichtigsten Aussagen zu [Thema] auf." Folie mit der
      Zusammenfassung ist ausgeblendet.
    participant_action: >
      Unterlagen schließen, Stift bereitlegen.
    note: >
      Die Ansage „aus dem Gedächtnis" ist der Kern. Ohne sie wird
      abgeschrieben, und der Effekt ist weg.
  - order: 2
    label: Allein abrufen
    duration_minutes: 3
    trainer_action: >
      Zeit geben, Stille halten. Nicht helfen, keine Stichworte geben.
    participant_action: >
      Drei Kernaussagen in eigenen Worten notieren. Was nicht einfällt,
      als Frage notieren.
    note: >
      Mühe beim Erinnern ist gewollt – gerade sie festigt das Wissen.
  - order: 3
    label: Mit dem Nachbarn abgleichen
    duration_minutes: 2
    trainer_action: >
      „Vergleichen Sie mit Ihrem Nachbarn: Was haben Sie beide, was
      fehlt einem von Ihnen?"
    participant_action: >
      Notizen vergleichen, ergänzen, Widersprüche markieren.
    note: >
      Der Abgleich deckt Lücken auf, ohne dass jemand vor der Gruppe
      etwas falsch sagen muss.
  - order: 4
    label: Mit der Zusammenfassung abgleichen
    duration_minutes: 2
    trainer_action: >
      Zusammenfassungsfolie zeigen. Fragen und Widersprüche aus der
      Gruppe kurz klären.
    participant_action: >
      Eigene Notiz mit der Folie vergleichen, Fehlendes ergänzen,
      offene Fragen stellen.
    note: >
      Rückmeldung zur richtigen Antwort gehört zur Abrufübung; ohne sie
      können sich Fehler festsetzen.

variations:
  - name: Brain Dump (alles notieren)
    description: >
      Statt drei Aussagen alles notieren, was zum Thema einfällt, zwei
      bis drei Minuten lang. Danach selbst die drei wichtigsten markieren.
    when_to_use: >
      Nach längeren Einheiten mit vielen Einzelheiten.
  - name: Verzögerter Abruf
    description: >
      Dieselbe Übung nicht direkt nach dem Thema, sondern nach der Pause
      oder am nächsten Morgen.
    when_to_use: >
      Wenn das Thema länger behalten werden soll; verbindet die Methode
      mit der verteilten Wiederholung.
  - name: Gruppenzusammenfassung
    description: >
      Nach dem Einzelabruf sammeln Kleingruppen eine gemeinsame Liste
      auf Flipchart; die Gruppen vergleichen ihre Listen.
    when_to_use: >
      Wenn das Ergebnis für alle sichtbar dokumentiert werden soll.
    setting_codes: [onsite]

pitfalls:
  - issue: >
      Die Zusammenfassungsfolie ist bereits sichtbar – TN schreiben ab.
    countermeasure: >
      Folie erst nach dem Abruf einblenden; Handouts geschlossen.
    severity: common
  - issue: >
      Der Abruf kommt direkt im Anschluss an das Thema – er ist zu
      leicht und wirkt kaum.
    countermeasure: >
      Etwas Abstand lassen, etwa nach einer kurzen Übung oder Pause.
    severity: common
  - issue: >
      TN erleben die Übung als Prüfung und sind gehemmt.
    countermeasure: >
      Ansagen, dass niemand vorlesen muss und nichts bewertet wird.
    severity: common
  - issue: >
      Der Abgleich fällt aus Zeitmangel weg.
    countermeasure: >
      Lieber zwei statt drei Aussagen abrufen, aber den Abgleich immer
      einplanen.
    severity: common

slug: kernaussagen-aus-dem-gedaechtnis
canonical_name: Kernaussagen aus dem Gedächtnis
synonyms:
  - synonym: Freier Abruf
    language: de
  - synonym: Brain Dump
    language: en
  - synonym: Free Recall
    language: en
short_description: >
  Ohne Unterlagen notiert jede Person die drei wichtigsten Aussagen zum
  gerade behandelten Thema, gleicht sie dann mit dem Nachbarn und erst
  danach mit der Zusammenfassung ab. Freier Abruf statt Wiederlesen –
  einer der am besten belegten Wege, Gelerntes zu festigen.
originator: Henry L. Roediger, Jeffrey D. Karpicke (Testing Effect)
origin_context: >
  Beruht auf dem Testing Effect: Abrufen aus dem Gedächtnis festigt
  Wissen stärker als erneutes Lesen (Roediger & Karpicke 2006).
  Dunlosky et al. (2013) bewerten Abrufübung („practice testing") als
  Lerntechnik mit hoher Nützlichkeit.

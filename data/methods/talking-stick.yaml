short_description: >
  Nur wer das Sprechobjekt in der Hand hat, redet — alle anderen hören
  aktiv zu. Ursprünglich aus indigenen Ratsversammlungen Nordamerikas;
  heute klassisches Werkzeug zur Beruhigung hitziger Gespräche, fairen
  Verteilung von Redeanteilen und Förderung tiefen Zuhörens. Funktioniert,
  weil das Objekt physisch macht, dass Rede ein Privileg ist, das man
  bewusst übergibt.

originator: null
origin_context: >
  Tradition mehrerer indigener Völker Nordamerikas (Lakota, Haudenosaunee
  u.a.). Im westlichen Trainings- und Mediations-Kontext seit den 1990ern
  populär — Stephen Covey nutzt das Talking Stick als Metapher in
  "The 7 Habits"; Marshall Rosenberg empfiehlt es im Kontext der Gewaltfreien
  Kommunikation für eskalierte Gespräche.


slug: peer-instruction
canonical_name: Peer Instruction
synonyms:
  - synonym: Konzeptfrage mit Peer-Diskussion
    language: de
  - synonym: ConcepTest
    language: en
short_description: >
  Eine Konzeptfrage mit plausiblen Fehlvorstellungen als Antwortoptionen:
  Erst antwortet jede Person allein, dann überzeugen sich Sitznachbarn
  gegenseitig zwei Minuten lang, dann wird erneut abgestimmt und aufgelöst.
  Macht Fehlvorstellungen sichtbar und korrigiert sie im Gespräch.
originator: Eric Mazur
origin_year: 1991
origin_context: >
  Von Eric Mazur an der Harvard University für Physik-Vorlesungen
  entwickelt, nachdem seine Studierenden Rechenaufgaben lösen konnten,
  einfache Konzeptfragen aber nicht. Über zehn Jahre Erfahrungsdaten
  bei Crouch & Mazur (2001); in Freemans Meta-Analyse (2014) eine der
  typischen Formen aktiven Lernens.

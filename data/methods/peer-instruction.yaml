steps:
  - order: 1
    label: Konzeptfrage stellen und allein antworten
    duration_minutes: 3
    trainer_action: >
      Konzeptfrage zeigen, Antwortoptionen vorlesen. Ansagen: „Eine
      Minute allein nachdenken, dann stimmen alle ab." Abstimmung
      einsammeln, Ergebnis noch NICHT zeigen und nicht kommentieren.
    participant_action: >
      Allein nachdenken, sich festlegen, abstimmen.
    note: >
      Die Frage prüft Verständnis, nicht Erinnern. Gute Optionen sind
      Fehlvorstellungen, die TN wirklich haben. Wenn eine Option
      niemand wählt, ist sie überflüssig.
  - order: 2
    label: Entscheiden, ob diskutiert wird
    duration_minutes: 1
    trainer_action: >
      Verteilung ansehen. Unter ca. 30 % richtig: Frage zu schwer,
      kurz nachschärfen statt diskutieren. Über ca. 70 % richtig:
      kurz auflösen und weiter. Dazwischen: Peer-Diskussion.
    participant_action: >
      Warten; je nach Fall direkt zur Auflösung.
    note: >
      Die Schwellen sind Richtwerte nach Crouch & Mazur. Der Mittel-
      bereich ist der, in dem Diskussion am meisten bringt.
  - order: 3
    label: Peer-Diskussion
    duration_minutes: 3
    trainer_action: >
      „Suchen Sie jemanden mit einer anderen Antwort und überzeugen
      Sie sich gegenseitig – mit Begründung." Herumgehen und zuhören,
      welche Argumente fallen. Nicht eingreifen.
    participant_action: >
      Eigene Antwort begründen, Gegenargumente prüfen, gegebenenfalls
      umdenken.
    note: >
      Was beim Zuhören fällt, ist Material für die Auflösung: die
      überzeugenden falschen Argumente zuerst entkräften.
  - order: 4
    label: Zweite Abstimmung und Auflösung
    duration_minutes: 5
    trainer_action: >
      Erneut abstimmen lassen, dann beide Verteilungen zeigen. Richtige
      Antwort begründen, die häufigste falsche Antwort ausdrücklich
      erklären: warum sie plausibel wirkt und wo sie kippt.
    participant_action: >
      Zweite Antwort abgeben, Auflösung mit eigener Begründung
      vergleichen, Rückfragen stellen.
    note: >
      Der Vergleich der beiden Runden macht den Lerneffekt für die
      Gruppe sichtbar und motiviert für die nächste Frage.

variations:
  - name: Mehrere Fragen als Serie
    description: >
      Drei bis fünf Konzeptfragen zu einem Thema hintereinander, jeweils
      mit kurzem Input dazwischen. Gliedert einen längeren Vortrag.
    when_to_use: >
      Bei abstrakten Themen mit vielen typischen Missverständnissen,
      etwa Recht, Statistik, Technik.
  - name: Begründung schriftlich
    description: >
      Vor der ersten Abstimmung schreibt jede Person einen Satz Begründung.
      Die Diskussion startet von den Notizen.
    when_to_use: >
      Wenn TN sonst raten oder sich nach der Mehrheit richten.
  - name: Remote mit Umfragetool
    description: >
      Beide Runden im Umfragetool, Diskussion in 2er-Breakouts von
      zwei bis drei Minuten. Erste Verteilung erst nach der zweiten
      Runde zeigen.
    when_to_use: >
      Standard für Online-Trainings. Breakout-Wechsel mit einplanen.
    setting_codes: [remote_sync]

pitfalls:
  - issue: >
      Die Frage prüft nur Faktenwissen, die Antwort ist eindeutig –
      die Diskussion bringt nichts.
    countermeasure: >
      Fragen zu Anwendung oder Begründung stellen („Was passiert,
      wenn …?"). Antwortoptionen aus echten Fehlvorstellungen bauen.
    severity: common
  - issue: >
      Das Ergebnis der ersten Runde wird gezeigt – TN schließen sich
      der Mehrheit an.
    countermeasure: >
      Erste Verteilung erst nach der zweiten Abstimmung zeigen.
    severity: common
  - issue: >
      Partner haben dieselbe Antwort und bestätigen sich nur.
    countermeasure: >
      Ausdrücklich jemanden mit anderer Antwort suchen lassen; Farbkarten
      helfen dabei.
    severity: common
  - issue: >
      Die Auflösung nennt nur die richtige Antwort.
    countermeasure: >
      Die häufigste falsche Antwort mit erklären – sie ist der eigentliche
      Lernanlass.
    severity: common
  - issue: >
      Zu viele Fragen hintereinander – die Methode ermüdet.
    countermeasure: >
      Höchstens drei bis fünf Fragen pro Block, dazwischen Input oder
      Übung.
    severity: rare

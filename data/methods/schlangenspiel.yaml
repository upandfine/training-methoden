short_description: >
  Teilnehmende reihen sich in einer Kette auf und ordnen sich nach einem
  Kriterium (Alter, Geburtstag, Schuhgröße, Berufsjahre). Kommunikation ist
  nonverbal oder mit Einschränkungen. Aktiviert und erzeugt Kontakt.

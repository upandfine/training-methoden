# === Stufe 2: Vertikale Tiefe ===
stage_2_status: human_reviewed
stage_2_author: AI-generated, reviewed 2026-04

steps:
  - order: 1
    label: Einführung & Setting
    duration_minutes: 5
    trainer_action: >
      Idee vorstellen: „Sie schreiben jetzt einen Brief an sich selbst
      — an Ihr Ich in 6 Wochen. Sie bekommen den Brief zurück und
      erinnern sich daran, was Sie sich heute vorgenommen haben."
      Brief ist privat, wird nicht gelesen.
    participant_action: >
      Zuhören, sich auf reflexive Stimmung einlassen, Papier/Tool
      bereitlegen.
    note: >
      Vertraulichkeit ist entscheidend. Wenn TN befürchten, der Brief
      werde gelesen, schreiben sie für den Trainer — nicht für sich.
  - order: 2
    label: Leitfragen anbieten
    duration_minutes: 5
    trainer_action: >
      Leitfragen ausgeben (sichtbar oder als Handout): „Was nehme ich
      aus diesem Training mit? Welche 1-3 Dinge möchte ich verändern?
      Was wäre erreicht, wenn ich mich in 6 Wochen freue? Was könnte
      mich hindern?".
    participant_action: >
      Leitfragen überfliegen, innerlich antworten beginnen.
    note: >
      Zu viele Leitfragen erdrücken. 3-5 reichen. TN müssen nicht
      alle beantworten.
  - order: 3
    label: Schreibzeit (still)
    duration_minutes: 15
    trainer_action: >
      15 min Stille. Keine Unterbrechung. Leitung still, ggf.
      Hintergrundmusik (instrumental). Ermutigung am Anfang: „Schreiben
      Sie in der Du-Form an sich selbst, als wären Sie Ihr bester
      Freund/Ihre beste Freundin."
    participant_action: >
      Handschrift oder digital, aber im Flow, nicht überarbeitend.
      Wenn stecken: weiterschreiben auch scheinbar Belangloses.
    note: >
      Handschrift hat Vorteile: langsamer, tiefer, erinnerungswerter.
      Aber digital hat Vorteile bei Asynchron-Versand.
  - order: 4
    label: Versandmethode wählen
    duration_minutes: 5
    trainer_action: >
      Optionen zeigen: (1) Brief versiegeln, Trainer verschickt in X
      Wochen. (2) FutureMe.org — digitaler Versand an eigene E-Mail.
      (3) Kalender-Termin mit Anhang. TN wählt Methode.
    participant_action: >
      Brief einpacken/adressieren/hochladen. Datum für Versand
      bestimmen.
    note: >
      Automatisierung (FutureMe) ist zuverlässiger als Trainer, der
      in 6 Wochen 30 Briefe rausschickt. Aber Trainer-Versand wirkt
      persönlicher.
  - order: 5
    label: Ritualischer Abschluss
    duration_minutes: 5
    trainer_action: >
      Kurzes Ritual: Briefe sammeln (in Box), oder symbolisch in
      Umschlag schieben. „Sie haben sich selbst ein Versprechen
      gegeben — der Trainer ist nur die Post." Gruppen-Moment des
      Commitments.
    participant_action: >
      Brief abgeben/abschicken, inneres Commitment spüren.
    note: >
      Der Akt des Abgebens ist symbolisch wichtig. Briefe die TN
      mitnehmen, landen oft nicht angekommen. Externe Versand-
      Infrastruktur erhöht Zuverlässigkeit.

variations:
  - name: Klassischer Papierbrief
    description: >
      Handschriftlich, Umschlag versiegelt. Trainer sammelt, schickt
      nach X Wochen per Post.
    when_to_use: >
      Onsite-Trainings, Bildungseinrichtungen mit Infrastruktur, wenn
      Haptik/Ritual betont werden soll.
  - name: FutureMe-Brief
    description: >
      Website FutureMe.org. TN tippen Brief, wählen Versanddatum.
      Wird automatisch als E-Mail verschickt.
    when_to_use: >
      Remote/Online-Trainings, wenn Trainer keine Versandinfrastruktur
      hat.
    setting_codes: [remote_sync, remote_async]
  - name: Video-Brief (Selfie-Video)
    description: >
      TN nimmt kurzes Video (2-3 min) auf, sendet an sich selbst per
      delayed email. Wirkung durch eigene Stimme/Gesicht sehr stark.
    when_to_use: >
      Soft-Skills-Trainings, wenn TN offen für Format sind, bei
      Einzelcoaching.
  - name: Peer-Brief
    description: >
      Zwei TN schreiben sich Briefe gegenseitig, tauschen versiegelte
      Umschläge. Peer sendet in X Wochen zurück.
    when_to_use: >
      Wenn Peer-Accountability stärker wirken soll als Selbst-
      Verpflichtung.
  - name: Struktur-Brief (Formular-Format)
    description: >
      Strukturiertes Template statt freier Brief: „Meine 3 Vorsätze",
      „Meine größten Hindernisse", „Mein Ziel in 6 Wochen".
    when_to_use: >
      Transfer-Sicherung in Fach-Trainings, wenn konkrete Actions
      wichtiger sind als emotionale Tiefe.
  - name: Mehrfach-Brief
    description: >
      Mehrere Briefe mit verschiedenen Versanddaten (1 Woche, 1 Monat,
      3 Monate). Langfristige Begleitung des Transfers.
    when_to_use: >
      Intensive Programme, Führungs-Development, wenn
      Verhaltensänderung über Monate stabilisiert werden soll.

pitfalls:
  - issue: >
      Brief wird nie verschickt — Trainer vergisst, TN landen in
      Wartefeld.
    countermeasure: >
      Versand automatisieren (FutureMe, Kalender-Erinnerung).
      Wenn Trainer versendet: Termin direkt nach Workshop
      eintragen.
    severity: common
  - issue: >
      Inhalt zu vage („Ich werde mich bemühen, besser zuzuhören"),
      wenig Transfer-Wirkung.
    countermeasure: >
      Leitfragen konkret („1-3 Situationen in denen ich X tue").
      Ggf. strukturiertes Template nutzen, nicht ganz freier Brief.
    severity: common
  - issue: >
      TN empfinden Übung als peinlich oder kitschig.
    countermeasure: >
      Framing ohne Pathos: „wissenschaftlich belegt als Transfer-
      Verstärker". Optional: sachlicher Ton, Struktur-Brief statt
      emotional.
    severity: rare
  - issue: >
      Vertraulichkeit nicht klar — TN vermuten, Brief wird gelesen.
    countermeasure: >
      Explizit ansagen: „Ich lese den Brief nie. Sie verschließen ihn
      selbst." Idealerweise TN-selbst-Versand (FutureMe), damit
      Trainer nicht mal physisch den Brief berührt.
    severity: common
  - issue: >
      Brief kommt an, wird überflogen und weggelegt — kein erneuter
      Impuls.
    countermeasure: >
      Am Trainingsende ankündigen: „In 6 Wochen bekommen Sie Post
      von sich selbst. Planen Sie 10 min dafür ein." Idealerweise
      Peer-Check-in zum gleichen Zeitpunkt.
    severity: common
  - issue: >
      TN haben keine E-Mail-Adresse, wollen digital nicht nutzen —
      Versand scheitert.
    countermeasure: >
      Papier-Option immer anbieten. Private Adresse (nicht Firma,
      weil Austritte möglich).
    severity: rare

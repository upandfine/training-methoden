slug: brainstorming
canonical_name: Brainstorming
synonyms:
  - synonym: Ideensturm
    language: de
short_description: >
  Gruppenbasierte Ideensammlung mit vier Regeln: Quantität vor Qualität, keine
  Kritik, wilde Ideen willkommen, auf Ideen anderer aufbauen. Divergente Phase
  jedes Kreativprozesses.
originator: Alex F. Osborn

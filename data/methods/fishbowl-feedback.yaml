short_description: >
  Eine kleine Gruppe diskutiert im Innenkreis über die vergangene Einheit
  („Was war hilfreich? Was nicht?"), die anderen beobachten. Durch Stuhlrotation
  wechseln Rollen. Erzeugt Feedback-Transparenz ohne klassische Runde.

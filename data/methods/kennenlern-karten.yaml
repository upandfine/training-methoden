short_description: >
  Kartenstapel mit offenen Fragen („Was war dein letztes Aha-Erlebnis?", „Was
  bringt dich zum Lachen?") wird in Kleingruppen gezogen und beantwortet.
  Niederschwellig, kulturneutral, gut skalierbar.

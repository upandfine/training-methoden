short_description: >
  Iteratives Problemlösungsformat in 6 Phasen (Verstehen, Beobachten, Sichtweise
  definieren, Ideen, Prototyp, Test). Nutzer:innen stehen im Zentrum; Fokus
  auf schnelle Prototypen und Feedback.
originator: IDEO / d.school Stanford (Hasso Plattner Institut Potsdam in DE)
origin_context: >
  Entwickelt ab den 1990ern bei IDEO (David Kelley u.a.), akademisch durch
  d.school Stanford etabliert; im deutschsprachigen Raum stark durch HPI
  Potsdam (Ulrich Weinberg) verbreitet.

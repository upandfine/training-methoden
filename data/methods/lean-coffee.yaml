slug: lean-coffee
canonical_name: Lean Coffee
synonyms: []
short_description: >
  Agendalose Diskussionsrunde. Teilnehmende sammeln Themen auf Post-its,
  priorisieren per Punktevoting, diskutieren das Top-Thema für 5–7 Min., danach
  Daumenabstimmung „weiter diskutieren oder Thema wechseln". Hocheffizient.
originator: Jim Benson, Jeremy Lightsmith

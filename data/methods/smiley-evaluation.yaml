short_description: >
  Kurze Evaluation mit drei bis fünf Smiley-Gesichtern (sehr zufrieden … sehr
  unzufrieden). Teilnehmende setzen einen Punkt oder Kreuz. Schnell,
  niederschwellig, auch mit Kindern und geringer Sprachbarriere einsetzbar.

slug: innerer-dialog
canonical_name: Innerer Dialog
synonyms:
  - synonym: Inner Dialogue
    language: en
  - synonym: Zwei-Stühle-Technik
    language: de
short_description: >
  TN führen einen schriftlichen oder inneren Dialog zwischen zwei Anteilen
  in sich („Der Mutige" vs. „Der Vorsichtige", „Ich heute" vs. „Ich in 6 Monaten").
  Macht innere Spannungen explizit und entscheidbar.
originator: Friedrich S. Perls
origin_context: >
  Wurzelt in der Gestalttherapie (Fritz Perls, „Empty Chair Technique", 1940er/50er);
  heute in Coaching, Supervision und Selbstreflexions-Workshops verbreitet.
  Auch als schriftliche Einzelarbeit praktikabel.

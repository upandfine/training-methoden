short_description: >
  Feste Kleingruppe (4–7 Personen) bearbeitet über mehrere Treffen reale
  Praxisprobleme der Mitglieder. Einer schildert, andere fragen — nur Fragen,
  keine Ratschläge. Zwischen den Treffen werden Handlungsschritte erprobt.
originator: Reg Revans
origin_context: >
  Entwickelt in den 1940ern von Reg Revans im britischen Kohlebergbau;
  heute Standardformat in Führungskräfte-Entwicklung und lernenden
  Organisationen.

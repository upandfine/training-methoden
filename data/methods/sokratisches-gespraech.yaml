slug: sokratisches-gespraech
canonical_name: Sokratisches Gespräch
synonyms:
  - synonym: Socratic Dialogue
    language: en
  - synonym: Sokratische Methode
    language: de
short_description: >
  Moderierte Gesprächsform, bei der durch gezielte Fragen (statt Antworten)
  Annahmen und Schlussfolgerungen der TN sichtbar und prüfbar gemacht werden.
  Ziel: eigenständiges Denken, nicht Wissensvermittlung.
originator: Leonard Nelson (moderne Form)
origin_context: >
  Rückgriff auf Sokrates (5. Jh. v.Chr., Platon); als didaktisches Format
  durch Leonard Nelson (1922) und Gustav Heckmann (1981) systematisiert
  („Neo-Sokratisches Gespräch").
phases:
  - code: deepening
    is_primary: true
  - code: reflection
settings:
  - code: onsite
    suitability: excellent
  - code: remote_sync
    suitability: good
    note: Funktioniert gut in kleinen Breakout-Runden; Gesprächsführung fordernder.
  - code: remote_async
    suitability: limited
    note: >
      Nur in der schriftlichen Variante (siehe Variation "Schriftliches
      Sokratisches Gespräch"); synchron-dialogische Dichte geht dabei
      verloren, strukturierte Fragekaskaden funktionieren aber.
  - code: hybrid
    suitability: good
group_sizes: [small, medium]
target_audiences: [adult_education, higher_education]
method_types: [reflective, cooperative]
duration_min_minutes: 60
duration_typical_minutes: 120
duration_max_minutes: 240
tags: [dialog, philosophisch, frageorientiert]
quality_status: human_reviewed
content_author: AI-generated, reviewed 2026-04


short_description: >
  Wiederkehrende, bewusste Eröffnungssequenz zu Beginn jedes Termins — z.B.
  gemeinsamer Atemzug, kurzes Standbild, wiederkehrendes Lied, Glocke. Schafft
  Gruppenzusammenhalt und klaren Übergang vom Alltag ins Lernen.

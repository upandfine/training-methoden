short_description: >
  Teilnehmende bringen (oder wählen vor Ort) einen Gegenstand mit, der sie
  repräsentiert — ein Buch, Schlüssel, Foto, eine Kaffeetasse. Jede:r stellt
  sich anhand des Symbols vor. Erzeugt persönlichen, nicht-oberflächlichen Kontakt.

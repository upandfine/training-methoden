short_description: >
  Statt „Wie lösen wir Problem X?" wird gefragt „Wie erreichen wir das
  Gegenteil / wie machen wir es garantiert schlimmer?". Die so gesammelten
  Anti-Ideen werden anschließend umgedreht.

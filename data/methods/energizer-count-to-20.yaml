short_description: >
  Gruppe steht im Kreis, Augen geschlossen oder zu Boden gerichtet. Ziel:
  gemeinsam von 1 bis 20 zählen — jede Zahl darf nur eine Person sagen, ohne
  Absprache. Bei Überlappung Neustart. Lehrt Aufmerksamkeit und Gruppen-Intuition.

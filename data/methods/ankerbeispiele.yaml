slug: ankerbeispiele
canonical_name: Ankerbeispiele
synonyms:
  - synonym: Anchored Instruction
    language: en
  - synonym: Situiertes Lernen
    language: de
short_description: >
  Lerninhalte werden an einem reichen, realitätsnahen Beispiel-Kontext
  („Anker") verankert. Statt abstrakte Regeln isoliert zu vermitteln,
  arbeiten TN mit einem konkreten Fall und extrahieren daraus Prinzipien.
originator: Cognition and Technology Group at Vanderbilt (CTGV)
origin_context: >
  1990er an der Vanderbilt University (USA); theoretische Grundlage im
  situierten Lernen (Lave/Wenger 1991) und in der kognitiven Flexibilitäts-
  theorie (Spiro). In der deutschen Didaktik häufig als „verankerte
  Unterweisung" aufgegriffen.

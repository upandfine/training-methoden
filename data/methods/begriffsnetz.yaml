# === Stufe 2: Vertikale Tiefe ===
stage_2_status: ai_draft
stage_2_author: AI-generated, awaits review

steps:
  - order: 1
    label: Prinzip zeigen
    duration_minutes: 3
    trainer_action: >
      An drei Begriffen vormachen: Begriffe legen, Pfeil ziehen, Pfeil
      mit einem Verb beschriften („Lärm – verursacht – Stress").
      Unterschied zur Mind-Map nennen.
    participant_action: >
      Zusehen, Beispiel nachvollziehen.
    note: >
      Die Beschriftung der Pfeile ist der Kern. Unbeschriftete Linien
      machen aus dem Begriffsnetz eine Mind-Map.
  - order: 2
    label: Begriffe ordnen und verbinden
    duration_minutes: 12
    trainer_action: >
      Begriffskarten ausgeben (8-15 Begriffe). Herumgehen und fragen:
      „Was steht auf diesem Pfeil?" Unbeschriftete Pfeile ansprechen.
    participant_action: >
      Begriffe anordnen, mit Pfeilen verbinden, jeden Pfeil beschriften.
      Fehlende Begriffe dürfen ergänzt werden.
    note: >
      Begriffe vorgeben, sonst dauert die Übung zu lange und die
      Ergebnisse sind nicht vergleichbar.
  - order: 3
    label: Netze vergleichen und besprechen
    duration_minutes: 5
    trainer_action: >
      Zwei Netze nebeneinander zeigen. Fragen: „Wo unterscheiden sich
      die Beziehungen?" Fehlerhafte Beziehungen gemeinsam korrigieren.
    participant_action: >
      Eigenes Netz mit anderen vergleichen, Beziehungen begründen.
    note: >
      Unterschiedliche Netze sind erwünscht, solange die Beziehungen
      stimmen.

variations:
  - name: Begriffsnetz aus dem Gedächtnis
    description: >
      Das Netz wird ohne Unterlagen erstellt, danach mit den Unterlagen
      abgeglichen und ergänzt.
    when_to_use: >
      Zur Sicherung am Ende eines Themas; verbindet Struktur mit
      Abrufübung.
  - name: Lückennetz
    description: >
      Ein teilweise fertiges Netz wird vorgegeben; TN ergänzen fehlende
      Begriffe oder Pfeilbeschriftungen.
    when_to_use: >
      Für Einsteiger oder bei knapper Zeit.
  - name: Gruppennetz
    description: >
      Kleingruppen erstellen ein gemeinsames Netz auf Packpapier und
      verhandeln dabei die Beziehungen.
    when_to_use: >
      Wenn die Diskussion über Zusammenhänge selbst das Ziel ist.
    setting_codes: [onsite]

pitfalls:
  - issue: >
      Pfeile bleiben unbeschriftet – es entsteht eine Mind-Map.
    countermeasure: >
      Beschriftung ausdrücklich verlangen und beim Herumgehen nachfragen.
    severity: common
  - issue: >
      Freie Begriffswahl – die Übung dauert zu lange und verzettelt sich.
    countermeasure: >
      Begriffe vorgeben, ergänzende Begriffe erlauben.
    severity: common
  - issue: >
      Ungeübte TN sind überfordert und brechen ab.
    countermeasure: >
      Mit einem Lückennetz beginnen; Prinzip vorher an einem Alltagsbeispiel
      zeigen.
    severity: common
  - issue: >
      Das Netz wird mit offenen Unterlagen abgemalt.
    countermeasure: >
      Unterlagen schließen lassen und erst danach abgleichen.
    severity: rare

slug: begriffsnetz
canonical_name: Begriffsnetz
synonyms:
  - synonym: Concept Map
    language: en
  - synonym: Begriffslandkarte
    language: de
  - synonym: Wissensnetz
    language: de
short_description: >
  Die TN ordnen vorgegebene Begriffe auf einer Fläche und verbinden sie
  mit beschrifteten Pfeilen, die die Beziehung benennen („verursacht",
  „ist Teil von"). Anders als die Mind-Map verzweigt das Begriffsnetz
  nicht von einem Zentrum, sondern macht Zusammenhänge ausdrücklich.
originator: Joseph D. Novak
origin_year: 1972
origin_context: >
  Von Joseph Novak an der Cornell University entwickelt, um
  Wissensveränderungen von Lernenden sichtbar zu machen (Grundlage:
  Ausubels Lerntheorie). Die Meta-Analyse von Nesbit & Adesope (2006)
  zeigt Vorteile gegenüber Lesen, Zuhören und Diskussion.

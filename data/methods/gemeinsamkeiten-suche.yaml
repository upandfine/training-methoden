short_description: >
  Kleingruppen suchen in 5–10 Minuten 5 ungewöhnliche Gemeinsamkeiten aller
  Mitglieder — über offensichtliche Merkmale hinaus („alle waren schon in
  Italien" zählt nicht). Erzeugt schnell Verbindung.

short_description: >
  Eine Person (Fallgeberin) schildert ein Anliegen. Eine Beobachtergruppe
  („Reflecting Team") tauscht sich anschließend hörbar aus, während die
  Fallgeberin zuhört. Danach nimmt die Fallgeberin zurück Stellung.

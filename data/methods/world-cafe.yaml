short_description: >
  Großgruppen-Format mit mehreren Tisch-Runden. Teilnehmende wechseln zwischen Tischen,
  jeweils ein:e Gastgeber:in bleibt und trägt vorherige Ideen weiter. Erzeugt dichten
  Austausch und Cross-Pollination zwischen Subgruppen.


short_description: >
  Strukturiertes Arbeitsblatt: 3 konkrete Maßnahmen, je mit „Was?", „Wer?",
  „Bis wann?", „Woran erkenne ich Erfolg?". Erhöht Transferwahrscheinlichkeit
  deutlich gegenüber reinem Vorsatz.

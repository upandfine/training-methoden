short_description: >
  Bewusste Unterbrechung in einer hitzigen oder festgefahrenen Diskussion:
  Trainer:in oder beliebige Teilnehmende rufen "Time-Out", die Gruppe hält
  an, atmet durch, beobachtet kurz den Zustand. Danach Neustart unter
  bewusster Vereinbarung (anderer Stil, anderer Inhalt, andere Reihenfolge).
  Deeskaliert Konflikte, ohne sie zuzudecken.


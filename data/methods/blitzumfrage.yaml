short_description: >
  Kurze Pulsabfrage mit einer einzigen Frage (Skala 1–5, Multiple Choice,
  offenes Wort). Reihum, per Handzeichen oder per Tool. Momentaufnahme
  zu Stimmung, Verständnis oder Position.

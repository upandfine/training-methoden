short_description: >
  Großgruppe wird in parallele Kleingruppen („Syndikate") aufgeteilt, die
  dasselbe Thema bearbeiten. Im Plenum vergleichen sie Ergebnisse — Unterschiede
  öffnen den Diskurs. Ursprung im britischen Nachkriegs-Staff-Training.

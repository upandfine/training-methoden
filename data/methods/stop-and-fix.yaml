short_description: >
  Während einer Übung (Rollenspiel, Simulation, Präsentation) wird jederzeit
  „Stop" gerufen — von Leitung oder Beobachtenden. Die Handlung wird
  zurückgedreht oder wiederholt, diesmal mit Korrektur/Alternative. Ermöglicht
  gezieltes Nacharbeiten ohne kompletten Neustart.

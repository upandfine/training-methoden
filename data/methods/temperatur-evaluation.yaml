  - synonym: Stimmungs-Thermometer
    language: de
short_description: >
  TN platzieren einen Punkt auf einem Thermometer (kalt bis heiß) oder
  einer Skala zu einer Leitfrage („Wie energiegeladen fühlst du dich?",
  „Wie hilfreich war die Session?"). Schnelle visuelle Momentaufnahme
  der Gruppenstimmung.
originator: null
origin_context: >
  Etabliert in der schul- und gruppenpädagogischen Praxis; verwandt
  mit Stimmungsbarometer, aber mit konkreter Thermometer-Metapher.
  Heute Standard in agilen Retros und Online-Moderation.

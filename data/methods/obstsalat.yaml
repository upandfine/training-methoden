short_description: >
  Stuhlkreis, eine Person in der Mitte. Jede:r bekommt eine Obstsorte zugewiesen.
  Die Person in der Mitte ruft eine Sorte — alle mit dieser Sorte wechseln
  die Plätze; wer keinen findet, ist als Nächste dran. „Obstsalat!" = alle wechseln.

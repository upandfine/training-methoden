short_description: >
  Teilnehmende präsentieren in 60–120 Sekunden eine Idee, ein Projekt oder
  eine Kernaussage. Zuhörende geben strukturiertes Feedback. Trainiert
  Fokus, Kernbotschaft, Präsenz.

short_description: >
  Kreativitätstechnik mit 7 Leitfragen-Kategorien zur Ideengenerierung:
  Substitute, Combine, Adapt, Modify, Put to other use, Eliminate, Reverse.
  Strukturierter Weg, um vorhandene Lösungen neu zu denken.
originator: Bob Eberle (auf Grundlage von Alex Osborn)
origin_context: >

slug: fishbowl-multistage
canonical_name: Fishbowl (mehrstufig)
synonyms:
  - synonym: Multi-Stage Fishbowl
    language: en
short_description: >
  Erweiterung des klassischen Fishbowls: Mehrere Innenkreis-Runden mit
  wechselnden Rollen (z.B. Expert:innen, Skeptiker:innen, Anwender:innen).
  Ermöglicht tiefe Perspektivwechsel in Großgruppen.
originator: null
origin_context: >
  Variante der klassischen Fishbowl-Methode aus Großgruppenmoderation und
  partizipativen Konferenzdesigns; die mehrstufige Form ist eher eine
  methodische Ausdifferenzierung als einer Einzelperson zuzuordnen.

short_description: >
  Teilnehmende zeichnen ihre (berufliche oder lebensgeschichtliche) Lebenslinie
  mit Hoch- und Tiefpunkten. Anschließend Paar- oder Kleingruppen-Austausch
  über prägende Stationen. Sehr persönlich — braucht geschützten Rahmen.

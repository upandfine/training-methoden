short_description: >
  Leitung stellt zugespitzte Entweder-Oder-Fragen („Strand oder Berge?",
  „Text oder Video?"). Teilnehmende wechseln bei jeder Frage die Seite
  im Raum. Aktiviert körperlich, erzeugt Lachen, zeigt Vielfalt.

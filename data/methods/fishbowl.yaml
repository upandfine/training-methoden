slug: fishbowl
canonical_name: Fishbowl
synonyms:
  - synonym: Innen-/Außenkreis
    language: de
  - synonym: Aquarium
    language: de
short_description: >
  Innerer Kreis diskutiert ein Thema, äußerer Kreis beobachtet. Ein freier
  Stuhl („Gaststuhl") im Innenkreis darf jederzeit von Außenkreis-Personen
  besetzt werden. Intensiver Diskurs bei kontrollierter Gruppengröße.
originator: null
origin_context: >
  Verbreitet in Großgruppenmethodik; Ursprünge nicht eindeutig zuschreibbar,
  viele Autoren beanspruchen Varianten.

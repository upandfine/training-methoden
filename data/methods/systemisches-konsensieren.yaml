short_description: >
  Entscheidungsverfahren, das nicht Zustimmung, sondern WIDERSTAND misst:
  jede:r bewertet alle Vorschläge auf einer Skala 0 (kein Widerstand) bis 10
  (maximaler Widerstand). Vorschlag mit dem geringsten Gesamt-Widerstand
  gewinnt. Entdeckt oft Konsensvorschläge, die in einer klassischen
  Mehrheitsabstimmung untergegangen wären.

originator: Erich Visotschnig, Siegfried Schrotta
origin_context: >
  In den 1990er Jahren von Visotschnig und Schrotta in Österreich entwickelt
  als Alternative zur Mehrheits-Demokratie. Heute verbreitet in Genossen-
  schaften, Vereinen, Soziokratie-nahen Organisationen, agilen Teams.


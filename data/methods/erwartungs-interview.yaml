short_description: >
  Teilnehmende interviewen sich in Paaren zu den Fragen: Was möchtest du
  heute mitnehmen? Was steht dem möglicherweise im Weg? Was brauchst du vom
  Trainer / von der Gruppe? Anschließend Kurzbericht ans Plenum.

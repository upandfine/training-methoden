short_description: >
  Strukturiertes 1:1-Feedback nach dem Muster: positive Beobachtung —
  konstruktive Kritik — positiver Abschluss. Niedrige Einstiegshürde,
  aber Vorsicht: wirkt bei inflationärem Einsatz durchschaubar und schwächt
  die Kritik.

short_description: >
  Thema wird mittig auf Plakat geschrieben. TN schreiben reihum oder gleichzeitig
  Beiträge, Kommentare, Fragen, ohne zu sprechen. Entsteht ein vielstimmiger
  schriftlicher Diskurs. Inklusiv — auch stille TN werden sichtbar.

short_description: >
  Jeder Finger steht für eine Kategorie — Daumen (das war gut), Zeigefinger
  (darauf weise ich hin), Mittelfinger (das fand ich schlecht), Ringfinger
  (das nehme ich mit), kleiner Finger (das kam zu kurz). Strukturiert Feedback.

short_description: >
  Teilnehmende wählen aus einer Auswahl von Bildkarten (30–80 Motive) diejenige
  aus, die am besten ausdrückt, wie sie ankommen. Reihum wird kurz begründet.
  Bildkarten senken die Einstiegshürde gegenüber rein verbalen Check-ins.

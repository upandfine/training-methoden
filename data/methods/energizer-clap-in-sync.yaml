steps:
  - order: 1
    label: Kreis bilden & Regeln
    duration_minutes: 1
    trainer_action: >
      Stuhl- oder Stehkreis. "Ich klatsche zu meiner
      Nachbarin links — sie klatscht möglichst
      zeitgleich mit. Klatsch-Impuls geht reihum."
      Vorzeigen.
    participant_action: >
      Im Kreis stehen, Nachbarn wahrnehmen.
    note: >
      Synchronität ist Kern. Bei zu früh klatschen:
      keine Übergabe, sondern eigenes Klatschen.
      Bei zu spät: Verzögerung.
  - order: 2
    label: Erste Runden synchronisieren
    duration_minutes: 2
    trainer_action: >
      Klatsch-Impuls startet. 2-3 Runden langsam,
      Synchronität üben. Lob bei guten Übergaben:
      "Das war perfekt!"
    participant_action: >
      Mit Nachbarin synchron klatschen, weitergeben.
    note: >
      Erste Runden langsam — alle finden Rhythmus.
      Tempo erst erhöhen, wenn Synchronität
      sitzt.
  - order: 3
    label: Variationen & Tempo-Wechsel
    duration_minutes: 1
    trainer_action: >
      Variationen: Richtung wechseln, Tempo
      erhöhen, doppelt klatschen, Klatsch
      "wegwerfen". Dynamik halten.
    participant_action: >
      Bei Variationen mitgehen. Schnell reagieren.
    note: >
      Variationen halten Spiel frisch. Nicht zu
      viele auf einmal — sonst Verwirrung.
  - order: 4
    label: Abschluss
    duration_minutes: 1
    trainer_action: >
      Mit gemeinsamem Klatschen oder Applaus
      enden. "Jetzt wach und fokussiert. Los geht's
      mit..."
    participant_action: >
      Zur Sitzordnung zurück, Energie mitnehmen.
    note: >
      Nicht ausweiten. Energizer ist Impuls, nicht
      Hauptprogramm. Auf Hochpunkt beenden.

variations:
  - name: Klassisch (Reihum-Klatsch)
    description: >
      Standard: Klatsch geht im Kreis weiter.
    when_to_use: >
      Schule, Jugend, Theater-Kontexte. 8-25 TN.
  - name: Mit Tempo-Steigerung
    description: >
      Tempo erhöhen bis Bruchpunkt. Mehr Spaß,
      mehr Konzentration.
    when_to_use: >
      Erfahrene Gruppen, wenn Steigerung erwünscht.
  - name: Mit Richtung-Wechsel
    description: >
      Per Geste Richtung umkehren. Aufmerksamkeit
      hochhalten.
    when_to_use: >
      Mittel-erfahren, wenn klassisch zu langweilig.
  - name: Mit "Stolen Clap" (übernehmen)
    description: >
      Eine Person kann Klatsch "stehlen" und in
      andere Richtung weitergeben.
    when_to_use: >
      Theater-affin, fortgeschrittene Improvisation.

pitfalls:
  - issue: >
      Synchronität klappt nicht — Methode bricht ab.
    countermeasure: >
      Langsamer starten. Bei Bruch: nicht frustriert,
      neu anfangen. Synchronität ist Übung, nicht
      Talent.
    severity: common
  - issue: >
      In Senior-Corporate kindisch.
    countermeasure: >
      Andere Energizer (Stretching, Atmung).
      Klatschen ist jugendnah.
    severity: common
  - issue: >
      Körperlich Eingeschränkte — Klatschen schwer.
    countermeasure: >
      Sanfte Variante (Schnipsen, Tippen).
      Inklusiv anpassen.
    severity: rare
  - issue: >
      Remote: Latenz killt Synchronität.
    countermeasure: >
      Online andere Energizer (Echo-Klatsch:
      Moderation klatscht, alle einzeln nach).
      Synchron ist remote nicht möglich.
    severity: common
    setting_codes: [remote_sync]
  - issue: >
      Spiel zu lang — Energie sinkt.
    countermeasure: >
      Max. 3-5 min. Energizer-Charakter durch
      Kürze.
    severity: common

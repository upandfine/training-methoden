short_description: >
  Im Kreis wird ein Klatsch-Impuls reihum weitergegeben — jede:r klatscht
  möglichst zeitgleich mit den Nachbarn. Nach wenigen Runden wird das Tempo
  erhöht oder die Richtung gewechselt. Fördert Fokus und Gruppengefühl.

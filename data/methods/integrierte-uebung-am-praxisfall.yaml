steps:
  - order: 1
    label: Fall bauen (vor der Session)
    duration_minutes: 0
    trainer_action: >
      VOR der Session: einen realistischen Fall entwerfen, der zwei bis
      vier behandelte Themen braucht, ohne sie zu nennen. Unterlagen,
      Kriterien und Lösungsskizze vorbereiten.
    participant_action: >
      — (Vorbereitung, nur Trainer)
    note: >
      Der Fall sollte nicht verraten, welches Thema an welcher Stelle
      gefragt ist. Genau das Erkennen ist die Übung.
  - order: 2
    label: Fall und Kriterien vorstellen
    duration_minutes: 5
    trainer_action: >
      Fall kurz vorstellen, Unterlagen verteilen, Kriterien für das
      Ergebnis nennen und sichtbar lassen. Gruppen bilden.
    participant_action: >
      Fall lesen, Kriterien zur Kenntnis nehmen, Rückfragen stellen.
    note: >
      Kriterien vorher nennen, nicht erst in der Auswertung.
  - order: 3
    label: Fall bearbeiten
    duration_minutes: 25
    trainer_action: >
      Herumgehen, mit Fragen helfen („Welches Thema von gestern passt
      hier?"), keine Lösungen vorgeben. Nach der Hälfte Zwischenstand
      abfragen.
    participant_action: >
      Fall analysieren, passende Themen erkennen, Lösung erarbeiten und
      festhalten.
    note: >
      Wenn eine Gruppe feststeckt, auf das passende Thema hinweisen,
      nicht auf die Lösung.
  - order: 4
    label: Auswertung an Kriterien
    duration_minutes: 10
    trainer_action: >
      Ergebnisse an den Kriterien prüfen, Lösungswege vergleichen.
      Benennen, an welchen Stellen welches Thema gebraucht wurde.
    participant_action: >
      Eigenes Ergebnis an den Kriterien prüfen, Lösungswege vergleichen.
    note: >
      Die Zuordnung „Stelle im Fall – Thema" macht den Zusammenhang
      ausdrücklich.

variations:
  - name: Eigener Praxisfall
    description: >
      TN bringen einen eigenen Fall mit, der die behandelten Themen
      berührt, und bearbeiten ihn in der Gruppe.
    when_to_use: >
      Bei erfahrenen TN; stärkt den Transfer. Fälle vorab ankündigen.
  - name: Fall in Etappen
    description: >
      Der Fall wird in zwei bis drei Etappen ausgegeben; jede Etappe
      bringt neue Informationen.
    when_to_use: >
      Bei längeren Übungsblöcken; macht den Fall realistischer.
  - name: Abschlussfall des Trainings
    description: >
      Ein umfangreicher Fall am Ende, der alle Themen des Trainings
      verbindet.
    when_to_use: >
      Als Abschluss vor Prüfungen oder vor der Rückkehr an den
      Arbeitsplatz.

pitfalls:
  - issue: >
      Der Fall verrät, welches Thema gefragt ist – es entsteht eine
      Reihe von Einzelübungen.
    countermeasure: >
      Den Fall aus der Praxis heraus beschreiben, nicht entlang der
      Themenliste.
    severity: common
  - issue: >
      Der Fall ist zu umfangreich und wird nicht fertig.
    countermeasure: >
      Den Fall vorab selbst in der geplanten Zeit durchgehen; notfalls
      in Etappen teilen.
    severity: common
  - issue: >
      Grundlagen sitzen noch nicht – TN sind überfordert.
    countermeasure: >
      Erst einsetzen, wenn die einzelnen Themen geübt wurden; vorher
      gestufte Übungen.
    severity: common
  - issue: >
      Die Auswertung bespricht nur die Lösung, nicht den Zusammenhang
      der Themen.
    countermeasure: >
      In der Auswertung ausdrücklich zuordnen, welches Thema an welcher
      Stelle gebraucht wurde.
    severity: rare

slug: integrierte-uebung-am-praxisfall
canonical_name: Integrierte Übung am Praxisfall
synonyms:
  - synonym: Komplexübung
    language: de
  - synonym: Ganzheitliche Übungsaufgabe
    language: de
  - synonym: Whole-Task Practice
    language: en
short_description: >
  Ein realistischer Fall verbindet mehrere zuvor behandelte Themen in
  einer Übung; das Ergebnis wird an vorher genannten Kriterien geprüft.
  Anders als Fallstudie oder Szenario-Übung liegt der Zweck im
  Zusammenführen: TN müssen erkennen, welches Gelernte wann gebraucht
  wird.
originator: Instruktionsdesign (van Merriënboer, 4C/ID); Problemorientiertes Lernen
origin_context: >
  Das 4C/ID-Modell von van Merriënboer setzt auf ganzheitliche
  Lernaufgaben, die Teilfertigkeiten im Zusammenhang üben. Dochy et al.
  (2003) zeigen für problembasiertes Lernen Vorteile bei der Anwendung
  von Wissen; Taylor et al. (2005) einen stärkeren Transfer, wenn
  Fälle aus der Praxis der TN stammen.

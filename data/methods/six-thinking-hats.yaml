short_description: >
  Strukturierte Gruppendiskussion, in der alle Teilnehmenden die Perspektive gleichzeitig wechseln.
  Jeder „Hut" steht für eine Denkrichtung (Fakten, Emotionen, Kritik, Optimismus, Kreativität, Steuerung).
  Vermeidet, dass Rollen (Pessimist, Optimist, Kritiker) personalisiert werden.


short_description: >
  Teilnehmende schreiben in einer Minute anonym auf: 1) Das wichtigste, was
  ich heute gelernt habe. 2) Welche Frage bleibt offen? Trainer:in wertet
  stichprobenartig aus und adressiert offene Fragen zu Beginn der nächsten
  Einheit.
originator: Richard Light / Thomas Angelo, Patricia Cross

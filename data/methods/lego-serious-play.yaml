slug: lego-serious-play
canonical_name: LEGO® Serious Play®
synonyms:
  - synonym: LSP
    language: en
  - synonym: Lego Serious Play
    language: en
short_description: >
  Teilnehmende bauen mit LEGO-Steinen Modelle zu gestellten Fragen
  (eigene Rolle, Teamdynamik, Strategie). Das Bauen macht Gedanken
  konkret und ermöglicht Erzählungen, die verbal schwer zugänglich wären.
originator: Johan Roos, Bart Victor (IMD Lausanne) / LEGO Group
origin_context: >
  Mitte 1990er entwickelt am IMD Lausanne zusammen mit der LEGO Group;
  Methodik seit 2010 als Open Source dokumentiert (Creative Commons).
  Wichtig: Open-Source-Status der Methodik und Markenschutz an LEGO® /
  LEGO Serious Play® sind zwei verschiedene Dinge. Für Benennung,
  Bewerbung und kommerzielle Nutzung der Marke empfiehlt sich eigene
  rechtliche Prüfung, gerade bei Werbematerial und öffentlichen
  Angeboten.

short_description: >
  Vollständig ausgearbeitete Lösungsbeispiele werden schrittweise reduziert —
  erst fehlt der letzte Schritt, dann zwei, dann alle. TN lösen zunehmend
  selbstständig. Kognitive Belastung wird schrittweise gesteigert.

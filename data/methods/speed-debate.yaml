short_description: >
  Teilnehmende debattieren in Paaren zu einer These — 2 Minuten Pro, 2 Minuten
  Contra, dann Rollenwechsel und neuer Partner. Schnelle, energiegeladene
  Auseinandersetzung mit unterschiedlichen Perspektiven.

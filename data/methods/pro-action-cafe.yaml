short_description: >
  Hybridform aus World Café und Open Space: Teilnehmende bringen eigene
  Anliegen an Tische, andere helfen in drei strukturierten Runden
  (Anliegen klären, was fehlt, nächste Schritte). Besonders gut für
  Weiterentwicklung eigener Projekte.
originator: Rainer von Leoprechting, Ria Baeck

slug: nps-training-evaluation
canonical_name: NPS-Training-Evaluation
synonyms:
  - synonym: Net Promoter Score for Training
    language: en
  - synonym: tNPS
    language: en
short_description: >
  Ein-Frage-Evaluation: „Würden Sie dieses Training einem Kollegen/einer
  Kollegin weiterempfehlen?" (Skala 0–10). Promotoren (9-10) minus
  Detraktoren (0-6) = NPS. Schlank, vergleichbar, aber oberflächlich —
  braucht eine offene Zusatzfrage zum „Warum?".
originator: Frederick F. Reichheld
origin_context: >
  Net Promoter Score von Fred Reichheld (Bain & Company), publiziert 2003
  im Harvard Business Review („The One Number You Need to Grow").
  In der Trainings-Evaluation unter „tNPS" (training NPS) adaptiert;
  wissenschaftlich kritisiert (u.a. Keiningham 2007) wegen begrenzter
  prognostischer Güte.

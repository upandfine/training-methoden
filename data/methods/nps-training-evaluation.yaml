steps:
  - order: 1
    label: NPS-Frage stellen
    duration_minutes: 1
    trainer_action: >
      Klare Frage: "Auf einer Skala 0-10 — wie
      wahrscheinlich würden Sie dieses Training
      einer Kollegin/einem Kollegen weiterempfehlen?"
      Skala visualisieren.
    participant_action: >
      Frage hören, eigene Bewertung mental fassen.
    note: >
      Die Frage ist Standard. Variation auf "weiterempfehlen"
      essentiell — nicht "wie zufrieden". Empfehlung
      ist verhaltensnah.
  - order: 2
    label: Antworten sammeln
    duration_minutes: 1
    trainer_action: >
      Anonyme Erhebung: Online-Tool, Karten, Hand-
      zeichen-Skala. Alle gleichzeitig, anonym.
    participant_action: >
      Wert wählen, eingeben oder zeigen.
    note: >
      Anonymität wichtig für Ehrlichkeit. Bei
      Hand-Variante: "Augen zu, dann hochhalten."
  - order: 3
    label: Offene Zusatzfrage
    duration_minutes: 2
    trainer_action: >
      Zweite Frage: "Was ist der wichtigste Grund
      für Ihre Bewertung?" Offen-Text. Macht
      NPS-Wert nutzbar.
    participant_action: >
      Kurze Begründung schreiben, ehrlich.
    note: >
      Ohne Zusatzfrage ist NPS-Wert hohl. Mit:
      konkrete Verbesserungs-Hinweise. Zusatzfrage
      ist wichtiger als Skala.
  - order: 4
    label: Auswertung & Konsequenz
    duration_minutes: 1
    trainer_action: >
      NPS berechnen: (% Promotoren 9-10) - (%
      Detraktoren 0-6) = NPS. Bei live: kurz nennen.
      Bei post: in Bericht. Konkret aus Zusatzfragen
      lernen.
    participant_action: >
      Wert wahrnehmen, Konsequenz mitnehmen.
    note: >
      NPS-Wert ist Indikator, kein vollständiges
      Bild. Zusatzfragen geben qualitative
      Tiefe.

variations:
  - name: Klassisch (NPS + offene Frage)
    description: >
      Standardvariante: 0-10-Skala + "Warum?".
    when_to_use: >
      Trainings-Abschluss, Kundenfeedback.
      Skalierbar.
  - name: Reine NPS (ohne Zusatzfrage)
    description: >
      Nur Skala. Schnell, aber inhaltlich
      unbrauchbar.
    when_to_use: >
      Reine Quantifizierung für KPI-Tracking.
      Nicht für inhaltliches Lernen.
  - name: Erweiterter NPS (3 Fragen)
    description: >
      NPS + "Was war besonders gut?" + "Was
      sollte sich ändern?" Mehr Tiefe.
    when_to_use: >
      Wenn detaillierteres Feedback gewünscht.
  - name: Live-NPS (Hand-Skala)
    description: >
      Hände in Höhe heben (0-10). Visuelle
      Bestätigung sofort.
    when_to_use: >
      Kleinere Gruppen, Live-Feedback.
  - name: Digital-Tools (Mentimeter, Typeform)
    description: >
      Online-Tool mit automatischer Aggregation.
    when_to_use: >
      Online + Präsenz, größere Gruppen,
      KPI-Tracking.
    setting_codes: [remote_sync, remote_async]

pitfalls:
  - issue: >
      Reine NPS ohne Zusatzfrage — nur Zahl, keine
      Erkenntnis.
    countermeasure: >
      Zusatzfrage immer dabei. Ohne sie ist NPS
      datenlos.
    severity: common
  - issue: >
      NPS-Wert wird überinterpretiert.
    countermeasure: >
      NPS ist Indikator, kein vollständiges
      Bewertungsbild. Wissenschaftliche Kritik
      kennen.
    severity: common
  - issue: >
      Bei kleinen Gruppen (< 10) ist NPS-Wert
      statistisch instabil.
    countermeasure: >
      Bei < 10 TN: andere Evaluation (Zielscheibe,
      qualitatives Feedback). NPS braucht Zahlen.
    severity: common
  - issue: >
      Höflichkeits-Bias — alle wählen 8.
    countermeasure: >
      Anonymität sichern. Klar: "9-10 nur bei
      echtem Empfehlen-Wollen, 0-6 bedeutet
      kritisch."
    severity: common
  - issue: >
      Skala-Verständnis variiert kulturell.
    countermeasure: >
      Bei interkulturellen Gruppen: Skala-
      Konvention erklären. NPS ist westlich
      geprägt.
    severity: common
  - issue: >
      Detraktoren werden ignoriert — nur
      Promotoren feiern.
    countermeasure: >
      Detraktoren-Antworten gezielt lesen. Hier
      liegt Verbesserungs-Potential.
    severity: common
  - issue: >
      Methode ersetzt tiefere Evaluation.
    countermeasure: >
      NPS ist Schnellbefund. Bei wichtigen
      Trainings: Kirkpatrick + qualitative
      Verfahren ergänzen.
    severity: common

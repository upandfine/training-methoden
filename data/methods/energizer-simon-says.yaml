short_description: >
  Leitung sagt „Simon says: Hände heben" — alle folgen. Ohne „Simon says"
  darf keine:r die Bewegung ausführen; wer doch mitmacht, scheidet aus.
  Klassiker, der schnell Energie und Aufmerksamkeit bringt.

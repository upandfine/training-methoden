short_description: >
  Zu einem Kernbegriff notieren TN zunächst einzeln ihre Definition, dann
  tauschen sie in Paaren, konsolidieren in Vierergruppen und präsentieren
  eine gemeinsame Definition dem Plenum. Klärt Begrifflichkeit vor
  tiefergehender Arbeit.

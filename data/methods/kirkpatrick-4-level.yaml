slug: kirkpatrick-4-level
canonical_name: Kirkpatrick 4-Level-Evaluation
synonyms:
  - synonym: Kirkpatrick Model
    language: en
  - synonym: Vier-Ebenen-Modell
    language: de
short_description: >
  Evaluationsrahmen auf 4 Ebenen: 1) Reaction (Zufriedenheit direkt),
  2) Learning (Wissen/Skills erworben), 3) Behavior (Verhalten im Arbeitsalltag
  nach Wochen), 4) Results (messbare Geschäftswirkung). Kein einzelnes Tool,
  sondern Bezugsrahmen für Evaluations-Design.
originator: Donald L. Kirkpatrick
origin_context: >
  1959 erstmals publiziert; 2016 von James und Wendy Kirkpatrick zum
  „New World Kirkpatrick Model" weiterentwickelt. Weltweit verbreitetster
  Evaluationsrahmen in Corporate Learning; die Kausalität zwischen den
  Ebenen wird in der Evaluationsforschung kontrovers diskutiert
  (vgl. Alliger/Janak 1989, Holton 1996).

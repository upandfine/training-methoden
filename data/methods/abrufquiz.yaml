slug: abrufquiz
canonical_name: Abrufquiz
synonyms:
  - synonym: Retrieval Quiz
    language: en
  - synonym: Low-Stakes-Quiz
    language: en
  - synonym: Wissensabfrage ohne Wertung
    language: de
short_description: >
  Wenige kurze Fragen, die aus dem Gedächtnis beantwortet werden, danach
  Auflösung mit Begründung. Ohne Punkte, Rangliste oder Benotung – der
  Abruf selbst ist die Lernhandlung. Abrufübung gehört zu den am besten
  belegten Lerntechniken.
originator: Henry L. Roediger, Jeffrey D. Karpicke (Testing Effect)
origin_context: >
  Beruht auf dem Testing Effect (Roediger & Karpicke 2006). Dunlosky et
  al. (2013) stufen „practice testing" als Technik mit hoher
  Nützlichkeit ein; sie wirkt auch ohne Benotung. Unterschied zu
  Quiz-Wettbewerb und digitalem Quiz: kein Wettbewerb, Schwerpunkt auf
  Auflösung und Begründung.
phases:
  - code: reflection
    is_primary: true
  - code: activation
  - code: practice
settings:
  - code: onsite
    suitability: excellent
    note: Handzeichen, ABCD-Karten oder Notiz auf Papier genügen.
  - code: remote_sync
    suitability: excellent
    note: Umfragetool oder Chat; Antworten erst nach Ablauf zeigen.
  - code: remote_async
    suitability: excellent
    note: Als Selbsttest im LMS mit Begründung zu jeder Antwort.
  - code: hybrid
    suitability: good
    note: Ein Umfragetool für alle, damit beide Seiten gleich teilnehmen.
group_sizes: [one_on_one, small, medium, large, plenary]
target_audiences: [corporate, ihk, adult_education, higher_education, school, youth]
method_types: [diagnostic, activating, didactic]
duration_min_minutes: 5
duration_typical_minutes: 10
duration_max_minutes: 15
materials:
  - 3-6 kurze Fragen (Auswahl oder offene Kurzantwort)
  - Abstimmungsmittel (ABCD-Karten, Handzeichen oder Umfragetool)
  - Auflösung mit Begründung je Frage
tags: [abruf, testing-effect, quiz, ohne-wettbewerb]

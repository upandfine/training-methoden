short_description: >
  Strukturiertes Feedback in drei Schritten: Wahrnehmung (was habe ich
  beobachtet?), Wirkung (wie wirkt das auf mich?), Wunsch (was möchte ich
  mir für die Zukunft wünschen?). Trennt Fakten, Emotion und Bitte.

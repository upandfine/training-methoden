slug: einzelarbeit-mit-arbeitsblatt
canonical_name: Einzelarbeit mit Arbeitsblatt
synonyms:
  - synonym: Stillarbeit
    language: de
  - synonym: Arbeitsblatt
    language: de
  - synonym: Worksheet Task
    language: en
short_description: >
  Jede Person bearbeitet allein eine klar umrissene Aufgabe mit Vorlage
  oder Checkliste. Wirksam ist sie, wenn dabei etwas Neues entsteht –
  formulieren, prüfen, entwerfen –, nicht beim bloßen Abschreiben oder
  Ausfüllen.
originator: Unterrichtspraxis; Einordnung nach dem ICAP-Modell (Chi & Wylie)
origin_context: >
  Grundform des individuellen Arbeitens. Das ICAP-Modell von Chi & Wylie
  (2014) erklärt, wann sie wirkt: Erzeugen TN etwas Neues (konstruktiv),
  lernen sie mehr als beim bloßen Markieren oder Übertragen (aktiv).
  Die Gestaltung des Arbeitsblatts entscheidet also über die Lernwirkung.
phases:

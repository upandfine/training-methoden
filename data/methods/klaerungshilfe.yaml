short_description: >
  Spezielle Form der Konfliktbearbeitung nach Christoph Thomann: Ziel ist
  nicht der "Frieden", sondern wechselseitiges Verstehen der inneren Welten.
  Stark dialogisch, Empathie- und Affekt-orientiert. Unterscheidet sich von
  Mediation durch tiefenpsychologischen Ansatz und längere, intensivere Sitzungen.

originator: Christoph Thomann
origin_context: >
  Thomann (Schüler von Schulz von Thun) entwickelte die Klärungshilfe in den
  1980/90ern als eigenständigen Ansatz. Heute Ausbildungsweg an der
  Klärungshilfe-Akademie in Hamburg; verbreitet im Coaching von Führungs-
  und Familienkonflikten.


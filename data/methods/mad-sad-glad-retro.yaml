short_description: >
  Teilnehmende sammeln Karten zu drei Kategorien: Was hat mich geärgert (Mad),
  was hat mich traurig/unzufrieden gemacht (Sad), worüber bin ich froh (Glad).
  Macht emotionalen Anteil an Arbeitsprozessen sichtbar.

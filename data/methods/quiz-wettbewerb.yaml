short_description: >
  Wissens-Check im Show-Format — Multiple-Choice, Tempo-Antworten, Punkte,
  Bestenliste. Live-Tools wie Kahoot, Mentimeter, Quizizz machen das in
  Sekunden auflegbar. Funktioniert als Aufwärmer (Vorwissen aktivieren),
  Lernstands-Check (mid-session), Wiederholung (Ende der Einheit) und in
  der Kombination Spaß + Druck zur kurzfristigen Motivation. Achtung:
  bestraft die Schüchternen und Langsamen — Anonymisierung als Stellschraube.

originator: null
origin_context: >
  Quiz-Show-Format als Lerntool seit den 2010ern populär durch Kahoot
  (gegründet 2013, Norwegen) und ähnliche Plattformen. In der Schulpraxis
  und IHK-Ausbildung breit etabliert; Corporate-Trainings nutzen es
  zunehmend als Auflockerung in mehrtägigen Schulungen.


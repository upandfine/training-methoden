steps:
  - order: 1
    label: Stationen aufbauen (vor der Session)
    duration_minutes: 0
    trainer_action: >
      VOR der Session: 4-6 Stationen aufbauen, je eine Aufgabe zu einem
      Teilaspekt mit Material und Lösungshinweis. Jede Station in
      gleicher Zeit lösbar. Laufzettel vorbereiten.
    participant_action: >
      — (Vorbereitung, nur Trainer)
    note: >
      Gleich lange Stationen sind die wichtigste Bedingung. Sonst
      stauen sich Gruppen.
  - order: 2
    label: Einführung und Gruppen bilden
    duration_minutes: 5
    trainer_action: >
      Ziel, Stationen, Reihenfolge und Wechselsignal erklären. Gruppen
      zu 3-4 Personen bilden und Startstationen verteilen.
    participant_action: >
      Laufzettel nehmen, zur Startstation gehen.
    note: >
      Die Reihenfolge muss nicht festliegen, wenn die Stationen
      voneinander unabhängig sind.
  - order: 3
    label: Arbeit an den Stationen
    duration_minutes: 32
    trainer_action: >
      Zeit je Station ansagen (z. B. 8 Minuten), Wechsel signalisieren.
      Herumgehen, bei Fragen helfen, Auffälligkeiten notieren.
    participant_action: >
      Aufgabe an der Station gemeinsam lösen, Ergebnis auf dem
      Laufzettel festhalten, mit dem Lösungshinweis vergleichen.
    note: >
      Bei vier Stationen à acht Minuten entsteht diese Dauer. Bei mehr
      Stationen entsprechend länger oder Wahlstationen einführen.
  - order: 4
    label: Auswertung im Plenum
    duration_minutes: 8
    trainer_action: >
      Je Station die wichtigste Erkenntnis sammeln; schwierige Stellen
      klären. Zusammenhang der Teilaspekte zeigen.
    participant_action: >
      Erkenntnisse nennen, offene Fragen stellen.
    note: >
      Ohne Zusammenführung bleiben die Teilaspekte unverbunden.

variations:
  - name: Pflicht- und Wahlstationen
    description: >
      Einige Stationen sind für alle Pflicht, weitere wählen die Gruppen
      nach Interesse oder Tempo.
    when_to_use: >
      Bei heterogenen Gruppen oder unterschiedlichem Vorwissen.
  - name: Expertenstationen
    description: >
      An jeder Station bleibt eine Person als Experte und erklärt den
      nachfolgenden Gruppen; die anderen rotieren.
    when_to_use: >
      Wenn die Aufgaben Vorwissen brauchen, das nicht jeder hat.
  - name: Digitale Stationen
    description: >
      Stationen als Breakout-Räume oder als Bereiche auf einem digitalen
      Whiteboard; Gruppen wechseln nach Zeit.
    when_to_use: >
      Online, wenn die Gruppe Erfahrung mit Breakouts hat. Mehr Zeit für
      den Wechsel einplanen.
    setting_codes: [remote_sync]

pitfalls:
  - issue: >
      Stationen sind unterschiedlich lang – Gruppen warten oder werden
      nicht fertig.
    countermeasure: >
      Jede Station vorab selbst in der geplanten Zeit testen; Zusatzaufgabe
      für schnelle Gruppen.
    severity: common
  - issue: >
      Die Vorbereitung wird unterschätzt.
    countermeasure: >
      Nur einsetzen, wenn mehrere gleichrangige Teilaspekte es lohnen;
      Stationen für spätere Trainings wiederverwenden.
    severity: common
  - issue: >
      Die Stationen zeigen nur Informationen – TN lesen, statt zu
      arbeiten.
    countermeasure: >
      An jeder Station eine Aufgabe mit Ergebnis verlangen.
    severity: common
  - issue: >
      Die Auswertung fällt weg, weil die Zeit verbraucht ist.
    countermeasure: >
      Auswertung fest einplanen; notfalls eine Station streichen.
    severity: common

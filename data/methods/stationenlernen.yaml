short_description: >
  Kleingruppen wechseln zwischen vorbereiteten Stationen, an denen je
  eine Aufgabe zu einem Teilaspekt des Themas liegt. Lohnt bei mehreren
  gleichrangigen Teilaspekten; die Vorbereitung ist aufwendig.
originator: Unterrichtspraxis (Lernzirkel aus dem Zirkeltraining im Sport)
origin_context: >
  Übertragen aus dem Zirkeltraining im Sportunterricht; seit den 1990er
  Jahren eine verbreitete Form offenen Unterrichts. In der
  Erwachsenenbildung für praxisnahe Themen mit mehreren Teilaspekten
  genutzt. Belege beziehen sich auf die Aufgaben an den Stationen,
  nicht auf die Form selbst.

short_description: >
  Teilnehmende tragen sich auf einem großen Papier/Whiteboard ein und zeichnen
  Verbindungen zu anderen, mit denen sie schon gearbeitet haben, ähnliche
  Rollen haben o.ä. Macht informelle Netzwerke im Raum sichtbar.

short_description: >
  Strukturiertes 6–8-Schritte-Format, in dem eine:r ein Praxisthema einbringt,
  die Gruppe Hypothesen und Lösungsideen entwickelt. Rollen (Fallgeber:in,
  Moderation, Beratende) sind klar getrennt. Ohne externe Berater:in.

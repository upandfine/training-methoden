steps:
  - order: 1
    label: Rahmen setzen & Begründung
    duration_minutes: 3
    trainer_action: >
      Kurz erklären: "Transfer gelingt dreimal besser mit Buddy
      als ohne. Wir suchen jetzt Partner, vereinbaren ein
      Check-in in 2-4 Wochen." Einfache Struktur vorschlagen:
      15 min Telefonat, 3 Fragen, Dokumentation.
    participant_action: >
      Verstehen, warum Buddy hilfreich ist. Offenheit
      signalisieren.
    note: >
      Ohne Begründung wirkt die Methode beliebig.
      Brinkerhoffs Daten sind überzeugend: bessere Umsetzung
      durch Accountability allein.
  - order: 2
    label: Buddy-Paare bilden
    duration_minutes: 5
    trainer_action: >
      Paar-Bildung moderieren. Optionen: (a) freie Wahl —
      nach Sympathie/Ähnlichkeit, (b) Los — zufällig,
      stärkt Netzwerk, (c) kriterienbasiert (ähnliche Rolle,
      unterschiedliche Organisation). Bei ungerader Anzahl:
      eine Dreiergruppe zulassen.
    participant_action: >
      Partner:in finden, ggf. nach Sympathie/Aufgabe, ggf.
      Dreier akzeptieren.
    note: >
      Freie Wahl ist pragmatischer, Los netzwerkbildender.
      Bei Schulklassen/Jugend: Los empfohlen (verhindert
      Cliquen). Bei Erwachsenen: freie Wahl OK.
  - note: >
      Die Struktur ist wichtig. Ohne sie vergessen 50 % der
      Paare das Check-in, weil niemand weiß, was besprochen
      werden soll. Vorlage = Sicherheit.
    order: 3
    label: Gemeinsame Agenda für Check-in
    duration_minutes: 5
    trainer_action: >
      Struktur für spätere Gespräch vorgeben: "3 Fragen, je 5
      min pro Seite: (1) Was haben Sie konkret umgesetzt?
      (2) Was ist gut gelaufen? (3) Wo hakt es noch?". Jede:r
      schreibt Agenda auf eigene Notiz.
    participant_action: >
      Agenda entgegennehmen, für sich klar haben, was im
      Check-in passiert.
  - order: 4
    label: Termin & Kanal festlegen
    duration_minutes: 5
    trainer_action: >
      Paare vereinbaren konkret: Datum (2-4 Wochen), Uhrzeit,
      Kanal (Telefon, Videocall, Kaffee). Kalender-Eintrag
      sofort — nicht später. Kontaktdaten austauschen.
    participant_action: >
      Termin in eigenen Kalender eintragen, Kontaktdaten
      austauschen, Vorfreude signalisieren.
    note: >
      "Sofort-Kalendereintrag" ist entscheidend. Wer
      vertagt, vergisst. Methode lebt von sofortiger
      Verbindlichkeit.
  - order: 5
    label: Erste Mini-Verabredung (als Probe)
    duration_minutes: 2
    trainer_action: >
      Kurz-Paarzeit: "Nehmen Sie sich jetzt 60 Sek., erzählen
      Sie Ihrem Buddy, was Sie konkret umsetzen wollen."
      Probe-Durchlauf macht das Format konkret.
    participant_action: >
      60 Sek. erzählen, wie man umsetzen will. Partner:in
      hört zu.
    note: >
      Die Mini-Verabredung schafft Verbindung zwischen den
      Buddies. Ohne sie bleibt es "ich kenne jemanden, mit
      dem ich vielleicht telefoniere".

variations:
  - name: Klassischer Umsetzungs-Buddy
    description: >
      2er-Paar, ein Check-in 2-4 Wochen nach Training, 15-30
      min Telefonat mit strukturierter Agenda.
    when_to_use: >
      Seminar-Abschluss mit konkreten Umsetzungs-Vorsätzen.
      Einzeln oder als Teil eines Transfer-Bausteins.
  - name: Langzeit-Buddy (3-6 Monate)
    description: >
      Regelmäßige Check-ins alle 4-6 Wochen über 3-6 Monate.
      Mehr Tiefe, mehr Accountability, aber braucht Commitment.
    when_to_use: >
      Führungskräfte-Entwicklung, Change-Begleitung, intensive
      Transformationen. Wenn längere Begleitung sinnvoll ist.
  - name: Dreier-Buddy-Gruppe
    description: >
      Drei statt zwei Personen. Check-in per Video oder
      Chat-Gruppe. Mehr Perspektiven, aber auch höherer
      Koordinations-Aufwand.
    when_to_use: >
      Bei ungerader TN-Zahl, oder wenn mehr Perspektiven
      erwünscht sind. Auch gut für verteilte Teams.
  - name: Buddy mit Trainings-Leitung
    description: >
      Trainer:in ist "dritter Buddy" und bekommt Kurzbericht
      per Mail. Mehr Verbindlichkeit, aber auch Verantwortung
      bei Trainer:in.
    when_to_use: >
      Hochwertige In-House-Trainings, Führungs-Development.
      Wenn Transfer-Tracking Teil des Trainings-Angebots ist.
  - name: Remote-Buddy (digital)
    description: >
      Check-ins per Videocall, Messenger-Chat, oder E-Mail.
      Trifft sich nie physisch.
    when_to_use: >
      Internationale Trainings, verteilte Teams. Genauso
      wirksam wie physische Variante.
    setting_codes: [remote_sync, remote_async]
  - name: Buddy-System mit Lerngruppen
    description: >
      Eingebettet in Lerngruppen-Struktur — jede Lerngruppe
      hat 3-4 Buddy-Paare, regelmäßige Meta-Check-ins.
    when_to_use: >
      Längere Programme (Lehrgänge, Studiengänge), wenn
      Transfer-Kultur aufgebaut werden soll.

pitfalls:
  - issue: >
      Buddy-Check-in wird vergessen — Termin verschoben,
      dann ganz vergessen.
    countermeasure: >
      Sofortiger Kalendereintrag mit Kontaktdaten. Erinnerungs-
      Mail/SMS am Termin-Tag. Commitment direkt im Plenum
      ausgesprochen.
    severity: common
  - issue: >
      Check-in wird oberflächlich ("Alles gut, bis dann").
    countermeasure: >
      Strukturierte Agenda mit konkreten Fragen vorgeben.
      15 min mindestens einplanen. Dokumentationsvorlage
      bereitstellen, die ernsthaftes Gespräch lenkt.
    severity: common
  - issue: >
      Eine Seite investiert, andere nicht — Asymmetrie.
    countermeasure: >
      Beide Seiten in gleicher Rolle: beide berichten,
      beide hören. Keine Coach-Klient-Dynamik, sondern
      Peer-zu-Peer. Klar kommunizieren.
    severity: common
  - issue: >
      Paar findet sich nicht sympathisch, Buddy-Struktur
      wird zur Last.
    countermeasure: >
      Freie Wahl bei Paar-Bildung. Bei Los-Verfahren:
      Austausch-Option nach erstem Check-in, wenn nicht
      passt. Nie zwingen.
    severity: common
  - issue: >
      Check-in wird zur Problem-Wälzung ohne Weiterführung.
    countermeasure: >
      Agenda enthält "Was sind die nächsten 2 Schritte?"
      als letzte Frage. Fokus auf Bewegung, nicht
      Analyse.
    severity: common
  - issue: >
      Trainer:in nimmt keinen Bezug auf Buddy-Ergebnisse
      — wirkt isoliert.
    countermeasure: >
      Im Training bei Follow-up-Kontakten oder Zusatz-
      treffen nach Buddy-Erfahrung fragen. Zeigt, dass
      Transfer ernst genommen wird.
    severity: rare
  - issue: >
      Buddy-Partner:in kennt den Kontext nicht —
      Gespräch wird abstrakt.
    countermeasure: >
      Beide bringen kurze Kontext-Skizze ins Gespräch:
      "Meine Rolle, mein Team, meine Herausforderung."
      Gegenseitige Einführung in die jeweilige
      Situation.
    severity: common

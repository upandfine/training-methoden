short_description: >
  Teilnehmende bewegen sich frei im Raum; die Leitung ruft „Atome zu X!" (z.B.
  „Atome zu 4!"). Teilnehmende bilden blitzschnell Gruppen der genannten Größe.
  Energiegeladen, auch zur Gruppenbildung nutzbar.

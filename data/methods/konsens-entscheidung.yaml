slug: konsens-entscheidung
canonical_name: Konsens-Entscheidung
synonyms:
  - synonym: Consensus Decision Making
    language: en
  - synonym: Einstimmiger Beschluss
    language: de
  - synonym: Konsensprinzip
    language: de

short_description: >
  Klassische Form der Gruppen-Entscheidung: alle Beteiligten müssen aktiv
  zustimmen, sonst gilt der Vorschlag nicht. Hohe Tragfähigkeit der
  Entscheidung, hohe Zeitkosten. Geeignet bei kleinen Gruppen mit großer
  Tragweite oder hohem Vertrauensbedarf — nicht für tagesgeschäftliche
  Entscheidungen unter Zeitdruck.

originator: null
origin_context: >
  Konsens als Entscheidungsform hat lange Tradition (Quaker-Versammlungen
  seit dem 17. Jh., zahlreiche indigene Ratsversammlungen). Im
  Gruppenarbeits-Kontext der westlichen Trainings-Tradition seit den 1960ern
  in basisdemokratischen und kooperativen Bewegungen verbreitet.


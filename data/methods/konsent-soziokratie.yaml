short_description: >
  Entscheidungsverfahren aus Soziokratie und Holacracy: ein Vorschlag gilt
  als angenommen, wenn niemand einen schwerwiegenden Einwand hat ("kein
  Veto"). Anders als Konsens braucht es keine aktive Zustimmung, anders als
  Mehrheit blockiert auch eine Minderheit nicht durch Stimmverhalten — nur
  durch substanzielle, begründete Einwände. Schnell und tragfähig zugleich.

originator: Gerard Endenburg / Brian Robertson
origin_context: >
  Endenburg entwickelte in den 1970er Jahren in den Niederlanden die
  Soziokratische Kreis-Organisations-Methode (SKM). Robertson übernahm das
  Konsent-Prinzip 2007 für seine Holacracy. Heute Standard in selbstorgani-
  sierten Teams, NGOs, agilen Organisationen.


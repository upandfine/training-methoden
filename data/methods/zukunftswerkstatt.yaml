slug: zukunftswerkstatt
canonical_name: Zukunftswerkstatt
synonyms:
  - synonym: Future Workshop
    language: en
short_description: >
  Dreiphasiger Großgruppenprozess: Kritikphase (was läuft schlecht?),
  Fantasiephase (Utopie ohne Sachzwänge), Verwirklichungsphase (konkrete
  Schritte). Partizipative Problemlösung mit Fokus auf kollektive Vision.
originator: Robert Jungk, Norbert Müllert
origin_context: >
  Entwickelt in den 1970ern von dem Zukunftsforscher Robert Jungk; 1989
  systematisch publiziert („Zukunftswerkstätten"). Basis für viele
  Großgruppenmethoden.

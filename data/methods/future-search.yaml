short_description: >
  Großgruppenkonferenz (40–80 Personen) über 2,5 Tage, die aktuelle Situation,
  Trends, gemeinsame Werte und Zukunftsbilder einer Organisation oder
  Community bearbeitet. Alle Stakeholder im Raum.
originator: Marvin Weisbord, Sandra Janoff
origin_context: >

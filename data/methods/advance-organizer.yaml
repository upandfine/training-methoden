steps:
  - order: 1
    label: Vorarbeit — Struktur extrahieren (Prep, außerhalb der Session)
    duration_minutes: 0
    trainer_action: >
      Vor dem Training: die Inhaltsstruktur des Themas in 5-9 Kernelemente
      zerlegen. Beziehungen klären (hierarchisch, sequenziell, kausal,
      kontrastiv). Visualisierung wählen: Mindmap, Flussdiagramm,
      Matrix, Hierarchie-Baum.
    participant_action: >
      (Vorbereitung, TN nicht beteiligt)
    note: >
      Die Qualität des Advance Organizers entscheidet über seine
      Wirkung. Zu detailliert = TN verwirrt. Zu abstrakt = keine
      Ankerpunkte. 7±2 Kernelemente sind Optimum.
  - order: 2
    label: Einführen & Überblick geben
    duration_minutes: 5
    trainer_action: >
      Visualisierung aufdecken und erklären: „Heute werden wir über X
      sprechen. So ist das Feld aufgebaut…" Jedes Element in 1-2 Sätzen,
      Beziehungen benennen. Verknüpfung mit vorhandenem Wissen der TN
      herstellen („Sie kennen vermutlich schon Y — hier erweitern wir
      um Z").
    participant_action: >
      Überblick aufnehmen, eigene Vorerfahrung andocken, Fragen
      auftauchen lassen (erst später stellen).
    note: >
      Wichtig: Ausubels Prinzip ist „subsumption" — neues Wissen wird
      an bestehendes angedockt. Ohne Verknüpfung zu Vorwissen wirkt
      der Organizer nur als Gliederung, nicht als Lern-Beschleuniger.
  - order: 3
    label: Orientierung bieten während des Trainings
    duration_minutes: 3
    trainer_action: >
      Organizer sichtbar belassen (Poster, Folie, digitales Board).
      Bei jedem neuen Abschnitt verweisen: „Wir sind hier [Punkt auf
      Organizer], jetzt kommen wir zu…". Am Ende des Trainings
      Rückbezug: Wo waren wir, was haben wir abgedeckt.
    participant_action: >
      Organizer als Landkarte nutzen, eigene Notizen daran anknüpfen.
    note: >
      Der Organizer wird oft nur am Anfang gezeigt und dann vergessen.
      Der wirkliche Effekt kommt durch die wiederholte Rückbezüge
      während des Trainings.

variations:
  - name: Klassischer Expositorischer Organizer
    description: >
      Abstrakte begriffliche Struktur, die dem Inhalt vorangestellt
      wird. Erklärt die Konzept-Hierarchie. Ausubels Originalform.
    when_to_use: >
      Bei abstrakten, wenig bekannten Themen; wenn TN sehr wenig
      Vorwissen haben.
  - name: Vergleichender Organizer
    description: >
      Stellt neue Inhalte in Kontrast zu bereits Bekanntem: „Sie kennen
      X — Y ist wie X, aber unterscheidet sich in Z". Nutzt Analogie
      und Gegenüberstellung.
    when_to_use: >
      Wenn TN ein verwandtes Thema schon kennen; Erweiterung oder
      Abgrenzung zu bestehendem Wissen.
  - name: Grafischer Organizer (Mindmap/Concept Map)
    description: >
      Rein visuell: Kernbegriff im Zentrum, verzweigte Unterthemen,
      farbkodiert. Ohne Begleittext. Funktioniert auch als stummes
      Poster.
    when_to_use: >
      Visueller Lerntyp dominiert; komplexe aber hierarchisch klare
      Themen.
  - name: Prozess-/Flussdiagramm-Organizer
    description: >
      Sequentielle Schritt-für-Schritt-Darstellung mit Entscheidungs-
      knoten. Zeitachse oder Logikfluss.
    when_to_use: >
      Prozesstrainings (Arbeitsabläufe, Projektmanagement, Methoden
      mit klaren Phasen).
  - name: Asynchroner Organizer (Pre-Work)
    description: >
      Kurzes Video (3-5 min) oder einseitiges Dokument wird vor
      dem Training verschickt. TN bringen bereits eine mentale
      Landkarte mit ins Training.
    when_to_use: >
      Remote/Flipped-Formate; wenn Trainingszeit knapp und hohe
      Dichte gewünscht.
    setting_codes: [remote_async]
  - name: Interaktiver Organizer (KWL-Chart)
    description: >
      TN füllen im Einstieg selbst: What I Know / What I Want to know /
      What I Learned. Advance Organizer entsteht kooperativ.
    when_to_use: >
      Wenn Vorwissen heterogen ist und aktiviert werden soll;
      jüngere TN, Schulkontext.

pitfalls:
  - issue: >
      Organizer ist zu detailliert — wirkt wie Agenda oder Skript,
      überfordert statt zu strukturieren.
    countermeasure: >
      Max. 7-9 Kernelemente. Detail-Gliederung gehört in die Agenda,
      nicht auf den Organizer. „Kann ich das in 60 Sekunden erklären?"
      als Selbsttest.
    severity: common
  - issue: >
      Kein Bezug zum Vorwissen der TN — Organizer bleibt abstrakt.
    countermeasure: >
      Vorher kurze Ankerfrage stellen („Was wissen Sie über X?"),
      Antworten im Organizer explizit verorten. Oder Vergleichenden
      Organizer wählen.
    severity: common
  - issue: >
      Organizer wird nur am Anfang gezeigt, danach nie wieder
      referenziert — Effekt verpufft.
    countermeasure: >
      Bewusste Rückbezüge an Übergängen: „Wir schließen Punkt 3 ab,
      jetzt kommen wir zu 4." Poster sichtbar aufhängen, nicht Folie
      einmal zeigen und weg.
    severity: common
  - issue: >
      Organizer als „Gliederung" missverstanden — Reihenfolge strukturiert
      statt inhaltliche Beziehungen gezeigt.
    countermeasure: >
      Fokus auf Beziehungen (Pfeile, Farben, Hierarchie), nicht auf
      Nummerierung. Ein Mindmap ist besser als eine Liste.
    severity: common
  - issue: >
      Trainer:in hält sich nicht an die eigene Struktur, Organizer und
      Inhalt driften auseinander.
    countermeasure: >
      Organizer beim Vortragen in Sichtweite haben, eigene Notizen
      daran ausrichten. Bei Abweichung ggf. explizit benennen:
      „Kleiner Exkurs außerhalb der Struktur."
    severity: rare
  - issue: >
      Visualisierung ist optisch unübersichtlich (zu viele Farben,
      zu dichte Beschriftung, schlechte Schriftgröße).
    countermeasure: >
      Visualisierungsregel: max. 3 Farben, Schriftgröße >= 24pt auf
      Poster, Weißraum einhalten. Idealerweise eine:n designaffine:n
      Kolleg:in drüber schauen lassen.
    severity: common

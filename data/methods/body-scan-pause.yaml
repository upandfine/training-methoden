  Angeleitete, 3–10-minütige Aufmerksamkeits-Sequenz, bei der nacheinander
  verschiedene Körperteile wahrgenommen werden. Senkt Anspannung, holt aus
  dem Denken in den Körper zurück. Gut als Mittags- oder Nachmittags-Reset.

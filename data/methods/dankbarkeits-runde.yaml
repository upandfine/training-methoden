steps:
  - order: 1
    label: Rahmen setzen & Freiwilligkeit klären
    duration_minutes: 1
    trainer_action: >
      "Bevor wir heute schließen: eine Dankbarkeits-Runde.
      Reihum sagt jede:r einen konkreten Dank an eine
      andere Person. 'Danke an X für...' — ein Satz reicht."
      Freiwilligkeit betonen: "Wer nicht will, sagt 'pass'."
    participant_action: >
      Zuhören, innerlich jemanden identifizieren, der heute
      etwas beigetragen hat.
    note: >
      Konkretheit ist Schlüssel. "Danke für die Offenheit"
      ist besser als "Danke für alles". Im Framing
      konkret-Modell zeigen.
  - order: 2
    label: Einstiegs-Dank (Moderation)
    duration_minutes: 1
    trainer_action: >
      Moderation startet mit konkretem Beispiel: "Ich möchte
      mich bei Anna bedanken — ihre Frage zur Transfer-Methode
      hat mich selbst zum Nachdenken gebracht." Konkret,
      spezifisch, mit Begründung.
    participant_action: >
      Modelling wahrnehmen, eigenes Beispiel mental
      vorbereiten.
    note: >
      Konkreter Bezug macht Dank wirksam. Pauschales "war
      nett" wirkt hohl. Beispiel-Dank der Moderation als
      Modelling, nicht als Zwang.
  - order: 3
    label: Reihum oder Popcorn-Runde
    duration_minutes: 5
    trainer_action: >
      TN nacheinander: "Danke an X für Y." Reihum (Kreisordnung)
      oder Popcorn (wer will, spricht). Bei Popcorn: kein
      Druck, zu sprechen. Bei Reihum: Pass-Option explizit.
    participant_action: >
      Eigenen Dank aussprechen oder pass sagen. Dank anderer
      hören, eigene Wahrnehmung bestätigt fühlen.
    note: >
      Emotionaler Raum entsteht. Pausen aushalten. Wer
      länger überlegt, findet oft tieferen Dank. Hetzen killt.
  - order: 4
    label: Abschluss-Geste
    duration_minutes: 2
    trainer_action: >
      Nach Abschluss der Runde: kurzer Dank an alle, die
      teilgenommen haben. "Danke für die Offenheit." Übergang
      zur Verabschiedung oder Ritual-Ende.
    participant_action: >
      Dank wahrnehmen, positiven Zustand mitnehmen.
    note: >
      Nicht gleich inhaltlich weiterziehen. Der emotionale
      Moment braucht Raum zum Nachklingen. Dann sauber
      verabschieden.

variations:
  - name: Klassisch (Reihum, 1-2 Sätze pro Person)
    description: >
      Standard-Variante: reihum, konkreter Dank, Pass-Option.
    when_to_use: >
      Seminar-Abschluss, Retrospektiven, Team-Events. 4-15
      TN ideal.
  - name: Kudos-Karten (Management-3.0-Stil)
    description: >
      TN schreiben Dank auf kleine Karten ("Kudo Cards"),
      übergeben physisch oder digital. Haptischer, bleibt
      als Erinnerung.
    when_to_use: >
      Agile Teams, Retrospektiven mit Material. Auch
      asynchron nutzbar.
  - name: Anonyme Dankbarkeit (Briefkasten)
    description: >
      TN werfen anonyme Dankeskarten in Box, die später
      verteilt werden. Weniger Druck, mehr Ehrlichkeit.
    when_to_use: >
      Bei Gruppen mit Hierarchien oder Scheu vor öffentlichem
      Dank. Integrations-Prozesse, sensible Kontexte.
  - name: Dankbarkeits-Wand
    description: >
      Über mehrere Tage oder Wochen wird Dank auf
      gemeinsamer Wand gesammelt. Jederzeit ergänzbar.
      Kontinuierlich.
    when_to_use: >
      Längere Programme, Team-Räume, wenn Dankbarkeits-
      Kultur aufgebaut werden soll.
  - name: Remote (Chat oder Video)
    description: >
      Online: Dank direkt im Videocall (reihum), oder im
      Chat (schriftlich). Emoji-Applaus nach jedem Dank.
    when_to_use: >
      Online-Trainings. Funktioniert gut — weniger
      Körperlichkeit, aber gleiche emotionale Wirkung.
    setting_codes: [remote_sync]
  - name: Paar-Dankbarkeit
    description: >
      2er-Paare, je 1 min gegenseitiger Dank. Intimer,
      weniger öffentlich. Keine Plenum-Phase.
    when_to_use: >
      Große Gruppen (>15), wenn reihum zu lang. Oder bei
      Gruppen, die öffentliches Teilen scheuen.

pitfalls:
  - issue: >
      Dank bleibt pauschal ("war alle toll!") — wirkt
      hohl.
    countermeasure: >
      Im Framing Konkretheit fordern. Beispiel vorgeben
      (Moderation-Modelling). Bei pauschalen Beiträgen
      sanft nachfragen: "An wen konkret?"
    severity: common
  - issue: >
      Einzelne TN werden mehrfach bedankt, andere gar
      nicht — Asymmetrie.
    countermeasure: >
      Bei auffälliger Asymmetrie: am Ende Moderation
      selbst bedanken, die unbeachteten Beiträge
      würdigen. Nächstes Mal: Paar-Variante, wo alle
      dran kommen.
    severity: common
  - issue: >
      "Dank" wird zu implizitem Lob-Wettbewerb —
      Stimmung kippt.
    countermeasure: >
      Framing: "Dank, nicht Lob. An eine Person, nicht
      an Gruppe." Wenn es kippt: kurz unterbrechen und
      Fokus zurückbringen.
    severity: rare
  - issue: >
      Pass-Option wird ignoriert — Stille erwartet, man
      muss sprechen.
    countermeasure: >
      Pass-Option mehrfach aktiv ansprechen. Nach jeder
      Runde: "Wer möchte, bitte. Wer nicht, ist auch
      gut." Freiwilligkeit durchhalten.
    severity: common
  - issue: >
      In hierarchischen Gruppen wird Dank strategisch
      (Chef zuerst loben).
    countermeasure: >
      Bei Gruppen mit Chef/Unterstellten: anonyme Variante.
      Oder Paar-Dankbarkeit, die Hierarchie umgeht.
    severity: common
  - issue: >
      Ritual wird abgenutzt durch zu häufige Nutzung.
    countermeasure: >
      Nicht in jeder Session einsetzen. Ca. alle 3-4 Sessions
      oder bei besonderen Anlässen. Varianten wechseln.
    severity: common
  - issue: >
      Dank wird unfreiwillig intim — emotional zu stark.
    countermeasure: >
      Framing: "Ein Satz, kein Roman." Zeitrahmen
      begrenzen. Bei starker Emotion: Raum geben, nicht
      ausschlachten, Übergang sanft setzen.
    severity: rare

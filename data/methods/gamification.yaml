short_description: >
  Gezielter Einsatz spieltypischer Elemente — Punkte, Level, Badges,
  Bestenlisten, Quests, Storyline — in nicht-spielerischen Lernkontexten.
  Aktiviert intrinsische und extrinsische Motivation, schafft Feedback-
  Schleifen, macht Fortschritt sichtbar. Besonders wirksam bei
  Auszubildenden, Schüler:innen und in Compliance-/Onboarding-Trainings.
  Vorsicht vor reiner Belohnungs-Logik — die hält nicht lange.

originator: Nick Pelling (Begriff) / Jane McGonigal (Bekanntheit)
origin_context: >
  Begriff "Gamification" 2002 von Nick Pelling geprägt, ab 2010 durch
  Jane McGonigal ("Reality is Broken") und Werbach/Hunter ("For the Win")
  popularisiert. Im deutschsprachigen Raum etabliert in der digitalen
  Bildung, im Corporate-Learning (LMS-Plattformen) und in der Ausbildung.


# === Stufe 2: Vertikale Tiefe ===
stage_2_status: human_reviewed
stage_2_author: AI-generated, reviewed 2026-04

steps:
  - order: 1
    label: Ritual ankündigen & Übergang markieren
    duration_minutes: 1
    trainer_action: >
      Deutliches Signal: "Wir kommen zum Ende. Bevor wir gehen —
      unser Abschluss-Ritual." Tempo senken, Stimme wird
      ruhiger. Bei wiederkehrendem Einsatz: Gruppe weiß
      automatisch, was jetzt kommt.
    participant_action: >
      Aufmerksamkeit von Inhalt zurückziehen, innerlich
      abschließen, ankommen im Jetzt.
    note: >
      Übergang ist die unterschätzte Kunst. Ohne klare
      Markierung verpufft das Ritual im Gewusel des
      Sessionendes. Tempo-Wechsel als Anker.
  - order: 2
    label: Ritual-Kern durchführen
    duration_minutes: 2
    trainer_action: >
      Das gewählte Ritual: gemeinsamer Abschlusssatz, Geste,
      Klangschale, 3 Atemzüge, "One word"-Runde, etc. Kurz
      und klar. Moderation führt vor — Gruppe folgt.
    participant_action: >
      Mitmachen, auch bei anfänglichem Zögern. Je öfter, desto
      selbstverständlicher.
    note: >
      Ritual muss zur Gruppe passen — esoterische Glockenschale
      in Führungsseminar kann scheitern. Pragmatisch wählen:
      Händeschütteln im Kreis, gemeinsames "Bis nächste Woche",
      1-Wort-Runde. Nicht gezwungen spirituell sein.
  - order: 3
    label: Persönlicher Abschluss
    duration_minutes: 1
    trainer_action: >
      Moderation schließt mit Dank oder einem einladenden
      Schlusssatz ("Danke für heute. Kommen Sie gut nach
      Hause."). Blickkontakt, ruhige Stimme. Kurze Pause.
    participant_action: >
      Wahrnehmen, erwidern (Blickkontakt, Nicken, Dank).
    note: >
      Dieser Moment ist oft der emotional bleibende. Ruhe und
      Anwesenheit ist wichtiger als inhaltliches Fazit.
  - order: 4
    label: Gehen ermöglichen
    duration_minutes: 1
    trainer_action: >
      Raum für Wechsel: "Wer möchte, kann noch bleiben — für
      die meisten ist jetzt Schluss." Keine Nachzügler-
      Aufgaben, keine "Ach übrigens..."-Zusätze. Klare
      Beendigung.
    participant_action: >
      Aufstehen, Sachen packen, sich verabschieden.
      Einzelgespräche oder Tür hinaus.
    note: >
      Saubere Beendigung ist Respekt vor der Zeit der TN.
      "Ach ja und noch..." nach dem Ritual bricht die
      Wirkung. Alles Wichtige VOR dem Ritual ansprechen.

variations:
  - name: Sprach-Ritual (gemeinsamer Satz)
    description: >
      Gemeinsam gesprochener Satz am Ende ("Wir gehen raus und
      machen etwas draus.", "Bis zum nächsten Mal — machen
      Sie's gut!"). Einfach, robust.
    when_to_use: >
      Corporate-Kontexte, Erwachsenenbildung. Niedrigschwellig,
      kein esoterischer Anschein.
  - name: Klangschale / Glocke
    description: >
      Eine Klangschale oder Glocke zum Ausklingen des Tones
      warten. TN hören bis zum letzten Ton. Achtsamkeits-
      basiertes Ritual.
    when_to_use: >
      MBSR-Kontexte, Retreats, achtsamkeitsoffene Gruppen.
      Nicht in Standard-Corporate-Trainings.
  - name: Gesten-Ritual (Kreis, Händeschütteln)
    description: >
      Gruppe steht im Kreis, macht gemeinsame Geste (Hände
      einmal hoch, Augenkontakt, Nicken). Körperlich,
      verbindend.
    when_to_use: >
      Jugend, Team-Events, Outdoor-Settings. Wenn Gruppe
      physisch anwesend und Berührung unkritisch.
  - name: One-Word-Abschluss
    description: >
      Jede:r nennt ein Wort zum heutigen Tag. Minimaler
      Reflexions-Impuls, maximale Beteiligung.
    when_to_use: >
      Standard-Seminare, Workshops, wenn kurze Reflexion
      ritualisiert werden soll. Funktioniert fast immer.
  - name: Dankbarkeit-Runde
    description: >
      Jede:r benennt eine Sache, für die sie:er heute
      dankbar ist. Positive Emotion zum Schluss.
    when_to_use: >
      Teams mit Vertrauen, Retreats, längere Programme.
      Nicht bei erzwungener Teilnahme oder Skeptikern.
  - name: Remote-Ritual (Kamera-Abschluss)
    description: >
      Alle Kameras an, gemeinsame Geste oder "Wink-Goodbye".
      Digital-Entsprechung des Händeschüttelns.
    when_to_use: >
      Online-Trainings, verteilte Teams. Robust, auch in
      großen Gruppen.
    setting_codes: [remote_sync]

pitfalls:
  - issue: >
      Ritual wirkt gezwungen oder albern — TN machen nicht
      mit.
    countermeasure: >
      Wahl passend zur Gruppe. Bei Corporate: Sprach-Ritual
      oder One-Word. Bei Jugend: bewegter, spielerischer.
      Authentizität wichtiger als Methoden-Reinheit.
    severity: common
  - issue: >
      Ritual wird abgenutzt durch zu häufigen Einsatz —
      reflexartig durchgezogen.
    countermeasure: >
      Gelegentlich variieren. Neue Version einführen ("heute
      mal anders..."), dann zu altem zurückkehren. Variation
      hält Lebendigkeit.
    severity: common
  - issue: >
      Trainer:in hängt "Ach übrigens..."-Zusätze nach dem
      Ritual an.
    countermeasure: >
      Disziplin: Nach Ritual ist Schluss. Alle Infos vor dem
      Ritual. Bei wirklich wichtigem Nachtrag: vorher neu
      eröffnen ("Moment, bevor wir abschließen —").
    severity: common
  - issue: >
      Neue TN wissen nicht, was zu tun ist — unangenehm.
    countermeasure: >
      Beim ersten Einsatz kurz erklären. Bei jedem neuen
      TN das Ritual zu Beginn der Session einführen.
      Niemand steht unwissend da.
    severity: common
  - issue: >
      Ritual-Zeit wird von Inhalts-Fragen überrollt.
    countermeasure: >
      Zeit für Ritual fest reservieren (3-5 min am Ende).
      Lieber Inhalt früher abschließen als Ritual
      wegzukürzen.
    severity: common
  - issue: >
      Ritual wirkt esoterisch und wird in professionellen
      Kontexten unpassend.
    countermeasure: >
      Pragmatisch wählen: kein Klangschale in Führungskräfte-
      Seminar. One-Word oder kurzer Abschlusssatz reicht.
      Anschlussfähigkeit vor Tiefe.
    severity: rare
  - issue: >
      Bei wechselnder Gruppe wird Ritual als Insider-Geheimnis
      erlebt — Neue fühlen sich ausgeschlossen.
    countermeasure: >
      Ritual zu Beginn der Session einführen (ggf. erneut).
      Neu-Einsteiger explizit begrüßen und einladen.
      Ritual soll integrieren, nicht ausgrenzen.
    severity: common

short_description: >
  TN formulieren ihre Transfer-Vorsätze in „Wenn-Dann"-Form: „Wenn Situation
  X eintritt, dann tue ich Y." Nachweislich deutlich höhere Umsetzungsrate
  als bei vagen Vorsätzen.

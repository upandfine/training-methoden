slug: dialog-bohm
canonical_name: Dialog nach Bohm
synonyms:
  - synonym: Bohmian Dialogue
    language: en
  - synonym: Bohm-Dialog
    language: de
short_description: >
  Formale Dialogform im Kreis, ohne Moderation, mit bewusster Zurücknahme
  eigener Urteile. Kernpraktiken: Zuhören, eigene Annahmen suspendieren,
  generativ denken. Ziel ist kollektive Reflexion, nicht Entscheidung.
originator: David Bohm
origin_context: >
  Entwickelt vom Physiker David Bohm (1980er); in Deutschland verbreitet
  durch W. Hartkemeyer („Dialog als Kunst gemeinsam zu denken"). Grundlage
  auch für Presencing / Theory U (Scharmer).

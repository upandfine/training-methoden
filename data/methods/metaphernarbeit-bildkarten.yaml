short_description: >
  TN wählen aus einem Bildkartensatz (z.B. OH-Karten, Klaxoon-Cards) eine
  Karte, die zu einer Frage passt („Wie fühlt sich mein Projekt gerade an?"),
  und erklären die Metapher. Öffnet Zugänge, die rein verbal schwer erreichbar
  sind.

slug: verteilte-wiederholung
canonical_name: Verteilte Wiederholung
synonyms:
  - synonym: Spaced Repetition
    language: en
  - synonym: Spaced Practice
    language: en
  - synonym: Wiederholung mit Abstand
    language: de
short_description: >
  Kurzer Abruf früherer Themen ohne Unterlagen – als Quiz, mit Karten
  oder einer Mini-Aufgabe –, eingeplant mit Abstand zum Thema: nach der
  Pause, am Tagesanfang oder am nächsten Termin. Ein Planungsprinzip,
  das Wiederholungen über das Training verteilt, statt sie zu bündeln.
originator: Hermann Ebbinghaus (Spacing-Effekt)
origin_year: 1885
origin_context: >
  Ebbinghaus beschrieb 1885, dass verteiltes Lernen besser behalten wird
  als massiertes. Cepeda et al. (2006) bestätigen den Spacing-Effekt in
  einer Synthese von über 300 Experimenten; Roediger & Karpicke (2006)
  zeigen, dass Abruf die Wirkung zusätzlich verstärkt.

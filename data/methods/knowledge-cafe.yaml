short_description: >
  Variante des World Café mit Fokus auf Erfahrungs- und Expertenwissen.
  Einstiegsimpuls durch Expert:innen, dann rotierende Tischrunden. Unterschied
  zu World Café: kein neues Problem lösen, sondern bestehendes Wissen teilen.

short_description: >
  Teilnehmende positionieren sich auf einer gedachten Linie zwischen zwei
  Polen (z.B. „Anfänger:in – Expert:in", „stimme nicht zu – stimme voll zu").
  Anschließend kurze Interviews in der eigenen Position.

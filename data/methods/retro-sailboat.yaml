short_description: >
  Visuelle Retro-Metapher: Segelboot auf dem Meer. Wind = was uns antreibt,
  Anker = was uns bremst, Felsen = Risiken, Insel = Ziel. TN sammeln Karten
  pro Feld, clustern, priorisieren Maßnahmen.

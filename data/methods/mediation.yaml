short_description: >
  Strukturierter Konflikt-Klärungsprozess durch eine allparteiliche dritte
  Person. Fünf Phasen: Auftragsklärung, Themensammlung, Konfliktbearbeitung,
  Lösungsfindung, Vereinbarung. Geeignet, wenn zwei Personen oder Gruppen
  einen Konflikt nicht mehr alleine klären können — die Mediator:in moderiert
  ohne eigene Lösungsvorschläge.

originator: null
origin_context: >
  Mediations-Verfahren als formale Methode hat in den USA der 1970er Wurzeln
  (Frank Sander, Harvard); im deutschsprachigen Raum etabliert seit den
  1990ern, gesetzlich verankert durch das Mediationsgesetz 2012. Heute
  Standard in Wirtschafts-, Familien- und Schulmediation.


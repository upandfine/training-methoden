slug: design-sprint
canonical_name: Design Sprint
synonyms:
  - synonym: Google Ventures Design Sprint
    language: en
short_description: >
  Zeitlich gepresstes 5-Tage-Format (oder kompaktere Varianten), in dem ein
  cross-funktionales Team ein Produkt- oder Serviceproblem von Verstehen bis
  validiertem Prototyp bearbeitet. Hohe Intensität, klare Tagesstruktur.
originator: Jake Knapp (Google Ventures)
origin_context: >
  Entwickelt 2012–2015 von Jake Knapp bei Google Ventures; publiziert in
  „Sprint" (2016, Knapp/Zeratsky/Kowitz). Starke Nähe zu Design Thinking,
  aber deutlich strukturierter und zeitlich gepackt.

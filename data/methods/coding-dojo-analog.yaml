short_description: >
  Kleine Gruppe übt ein Kata (kurze, wiederholbare Übung) gemeinsam; ein
  Paar arbeitet am „Driver/Navigator"-Rechner, die anderen beobachten.
  Prinzip lässt sich auf andere Felder (Verkauf, Moderation, Pflege)
  übertragen: wiederholbare Mini-Übung, Rotation, Feedback.
originator: Laurent Bossavit, Emmanuel Gaillot (Coding Dojo i.e.S.)
origin_context: >
  Coding Dojo 2005 in Paris etabliert; auf das allgemeine Dojo-Prinzip
  (japanische Kampfkunst-Übungshallen) übertragen. In der Trainer:innen-
  Szene auch als „Practice Dojo" oder „Kata-Session" bekannt.

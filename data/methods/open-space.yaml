short_description: >
  Großgruppenformat mit selbstorganisierter Agenda. Teilnehmende schlagen Themen
  vor, bilden Sessions, wechseln nach „Gesetz der zwei Füße". Erzeugt hohe
  Beteiligung und Eigenverantwortung.

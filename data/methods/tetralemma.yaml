    language: en

short_description: >
  Systemische Klärungsmethode aus dem indischen Rechtsdenken: vier Positionen
  (das Eine, das Andere, beides, keines von beidem) plus ein fünfter freier
  Standpunkt machen Konflikte und Entscheidungs-Patts beweglich. Klassiker
  der systemischen Strukturaufstellung — geeignet, wenn ein Konflikt zwischen
  zwei scheinbar unvereinbaren Optionen festgefahren ist.

originator: Insa Sparrer / Matthias Varga von Kibéd
origin_context: >
  Sparrer und Varga von Kibéd haben das Tetralemma aus dem altindischen
  Catuṣkoṭi (vierfache Logik) für die systemische Beratung adaptiert.
  Klassisches Werkzeug der Systemischen Strukturaufstellungen (SySt®).


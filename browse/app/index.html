<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trainingsmethoden-Katalog</title>
  <!--
    Single-Page-Sucher-UI.
    Bewusst CDN-basiert (Tailwind via Play CDN, Alpine.js via CDN), damit
    Samuel die Seite ohne npm-Build editieren kann. Sobald die UX sitzt,
    portieren wir nach Next.js + Tailwind-Build.
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    /* Custom Properties statt direkter Klassen, damit ein späteres Theming
       leichtfällt. Tailwind-Klassen referenzieren die Werte via arbitrary
       values, wo nötig. */
    :root {
      --bg: #fafaf9;          /* stone-50 */
      --surface: #ffffff;
      --ink: #1c1917;         /* stone-900 */
      --ink-soft: #57534e;    /* stone-600 */
      --line: #e7e5e4;        /* stone-200 */
      --accent: #0f766e;      /* teal-700 */
      --accent-soft: #ccfbf1; /* teal-100 */
    }
    body { background: var(--bg); color: var(--ink); }
    /* Scrollbar dezent (für die Sidebar mit langer Filter-Liste). */
    .quiet-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .quiet-scroll::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 4px; }
  </style>
</head>
<body
  class="min-h-screen text-stone-900"
  x-data="catalogApp()"
  x-init="bootstrap()"
>

  <!-- Top Bar -->
  <header class="border-b border-stone-200 bg-white sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-4">
      <h1 class="text-xl font-semibold tracking-tight whitespace-nowrap">
        <span class="text-teal-700">●</span> Methoden-Katalog
      </h1>

      <!-- Search Box -->
      <div class="flex-1 flex items-center gap-2">
        <div class="relative flex-1 max-w-2xl">
          <input
            type="search"
            x-model="query"
            @input.debounce.300ms="runSearch()"
            placeholder="z.B. Energizer am Morgen, Konflikt klären, Gruppe vorstellen …"
            class="w-full px-4 py-2 rounded-lg border border-stone-300 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-teal-500 text-sm"
            aria-label="Suchbegriff"
          />
          <span
            x-show="loading"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 text-xs"
            x-cloak
          >suche…</span>
        </div>

        <!-- Mode Toggle -->
        <div class="hidden sm:flex items-center gap-1 text-xs bg-stone-100 rounded-lg p-1">
          <template x-for="m in ['hybrid', 'lexical', 'semantic']" :key="m">
            <button
              type="button"
              @click="searchMode = m; runSearch()"
              :class="searchMode === m
                ? 'bg-white shadow-sm text-stone-900 font-medium'
                : 'text-stone-600 hover:text-stone-900'"
              class="px-3 py-1 rounded-md transition-colors"
              x-text="m"
            ></button>
          </template>
        </div>
      </div>

      <span class="text-xs text-stone-500 hidden md:block">
        <span x-text="totalCount"></span> Methoden
      </span>
    </div>
  </header>

  <!-- Main Layout: Sidebar + Results -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-8">

    <!-- Filter Sidebar -->
    <aside
      class="space-y-6 lg:sticky lg:top-20 lg:self-start lg:max-h-[calc(100vh-6rem)] lg:overflow-y-auto quiet-scroll pr-2"
    >
      <!-- Phase -->
      <section>
        <h2 class="text-xs uppercase tracking-wider text-stone-500 font-medium mb-2">Phase</h2>
        <div class="space-y-1">
          <template x-for="p in refs.phases" :key="p.code">
            <label class="flex items-center gap-2 text-sm cursor-pointer hover:text-teal-700">
              <input
                type="radio"
                name="phase"
                :value="p.code"
                x-model="filters.phase"
                @change="runSearch()"
                class="accent-teal-700"
              />
              <span x-text="p.label_de"></span>
            </label>
          </template>
          <label class="flex items-center gap-2 text-sm cursor-pointer text-stone-500 hover:text-stone-900">
            <input type="radio" name="phase" value="" x-model="filters.phase" @change="runSearch()" class="accent-stone-500" />
            <span>(alle)</span>
          </label>
        </div>
      </section>

      <!-- Setting -->
      <section>
        <h2 class="text-xs uppercase tracking-wider text-stone-500 font-medium mb-2">Setting</h2>
        <div class="space-y-1">
          <template x-for="s in refs.settings" :key="s.code">
            <label class="flex items-center gap-2 text-sm cursor-pointer hover:text-teal-700">
              <input
                type="checkbox"
                :value="s.code"
                x-model="filters.setting"
                @change="runSearch()"
                class="accent-teal-700"
              />
              <span x-text="s.label_de"></span>
            </label>
          </template>
        </div>
      </section>

      <!-- Group Size -->
      <section>
        <h2 class="text-xs uppercase tracking-wider text-stone-500 font-medium mb-2">Gruppengröße</h2>
        <div class="space-y-1">
          <template x-for="g in refs.group_sizes" :key="g.code">
            <label class="flex items-center gap-2 text-sm cursor-pointer hover:text-teal-700">
              <input
                type="checkbox"
                :value="g.code"
                x-model="filters.group_size"
                @change="runSearch()"
                class="accent-teal-700"
              />
              <span x-text="g.label_de"></span>
            </label>
          </template>
        </div>
      </section>

      <!-- Audience -->
      <section>
        <h2 class="text-xs uppercase tracking-wider text-stone-500 font-medium mb-2">Zielgruppe</h2>
        <div class="space-y-1">
          <template x-for="a in refs.audiences" :key="a.code">
            <label class="flex items-center gap-2 text-sm cursor-pointer hover:text-teal-700">
              <input
                type="checkbox"
                :value="a.code"
                x-model="filters.audience"
                @change="runSearch()"
                class="accent-teal-700"
              />
              <span x-text="a.label_de"></span>
            </label>
          </template>
        </div>
      </section>

      <!-- Method Type -->
      <section>
        <h2 class="text-xs uppercase tracking-wider text-stone-500 font-medium mb-2">Methoden-Typ</h2>
        <div class="space-y-1">
          <template x-for="t in refs.method_types" :key="t.code">
            <label class="flex items-center gap-2 text-sm cursor-pointer hover:text-teal-700">
              <input
                type="checkbox"
                :value="t.code"
                x-model="filters.method_type"
                @change="runSearch()"
                class="accent-teal-700"
              />
              <span x-text="t.label_de"></span>
            </label>
          </template>
        </div>
      </section>

      <!-- Quality Filter -->
      <section>
        <h2 class="text-xs uppercase tracking-wider text-stone-500 font-medium mb-2">Qualität</h2>
        <div class="space-y-1 text-sm">
          <label class="flex items-center gap-2 cursor-pointer hover:text-teal-700">
            <input type="checkbox" x-model="filters.onlyReviewed" @change="runSearch()" class="accent-teal-700" />
            <span>Nur Human-Reviewed</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer hover:text-teal-700">
            <input type="checkbox" x-model="filters.onlyStage2" @change="runSearch()" class="accent-teal-700" />
            <span>Nur mit Stage-2-Vertiefung</span>
          </label>
        </div>
      </section>

      <button
        @click="resetFilters(); runSearch()"
        class="w-full text-xs text-stone-500 hover:text-stone-900 underline underline-offset-2 mt-2"
      >Filter zurücksetzen</button>
    </aside>

    <!-- Results -->
    <main class="min-w-0">
      <div class="flex items-center justify-between mb-3 text-xs text-stone-500">
        <span>
          <span x-text="results.length"></span> Treffer
          <template x-if="query">
            für <span class="font-medium text-stone-700" x-text="`„${query}"`"></span>
            (<span x-text="searchMode"></span>)
          </template>
        </span>
        <span x-show="lastError" class="text-rose-600" x-text="lastError" x-cloak></span>
      </div>

      <!-- Empty / Loading State -->
      <div
        x-show="!loading && results.length === 0"
        class="text-center py-16 text-stone-400 text-sm"
        x-cloak
      >
        Keine Methoden gefunden — Filter lockern oder anders formulieren.
      </div>

      <!-- Result Grid -->
      <ul class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">
        <template x-for="m in results" :key="m.slug">
          <li>
            <button
              type="button"
              @click="openDetail(m.slug)"
              class="text-left w-full h-full bg-white border border-stone-200 hover:border-teal-500 hover:shadow-sm rounded-lg p-4 transition-all"
            >
              <div class="flex items-start justify-between gap-2 mb-2">
                <h3 class="font-semibold text-sm leading-tight" x-text="m.canonical_name"></h3>
                <span
                  x-show="m.duration_typical_minutes"
                  class="text-[10px] uppercase tracking-wider text-stone-500 whitespace-nowrap"
                  x-text="m.duration_typical_minutes + ' min'"
                ></span>
              </div>
              <p class="text-xs text-stone-600 line-clamp-3" x-text="m.short_description || ''"></p>
              <div class="flex flex-wrap gap-1 mt-3">
                <template x-for="code in (m.method_type_codes || []).slice(0, 3)" :key="code">
                  <span class="text-[10px] uppercase px-1.5 py-0.5 bg-stone-100 text-stone-600 rounded" x-text="code"></span>
                </template>
                <span
                  x-show="m.stage_2_status === 'human_reviewed' || m.stage_2_status === 'expert_verified'"
                  class="text-[10px] uppercase px-1.5 py-0.5 bg-teal-50 text-teal-800 rounded"
                  x-cloak
                >Stage 2</span>
                <span
                  x-show="m.quality_status === 'ai_draft'"
                  class="text-[10px] uppercase px-1.5 py-0.5 bg-amber-50 text-amber-800 rounded"
                  x-cloak
                >ai-draft</span>
              </div>
            </button>
          </li>
        </template>
      </ul>
    </main>
  </div>

  <!-- Detail Drawer -->
  <div
    x-show="detail"
    x-cloak
    @keyup.escape.window="closeDetail()"
    @click.self="closeDetail()"
    class="fixed inset-0 z-30 bg-stone-900/30 backdrop-blur-sm flex justify-end"
  >
    <article
      class="bg-white w-full max-w-2xl h-full overflow-y-auto quiet-scroll p-6 sm:p-8 shadow-xl"
      x-show="detail"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="translate-x-full"
      x-transition:enter-end="translate-x-0"
    >
      <template x-if="detail">
        <div class="space-y-6">
          <header class="flex items-start justify-between gap-4">
            <div>
              <h2 class="text-2xl font-semibold tracking-tight" x-text="detail.canonical_name"></h2>
              <p class="text-xs text-stone-500 mt-1" x-text="detail.slug"></p>
            </div>
            <button @click="closeDetail()" class="text-stone-400 hover:text-stone-900 text-2xl leading-none" aria-label="Schließen">×</button>
          </header>

          <p class="text-sm text-stone-700 leading-relaxed whitespace-pre-line" x-text="detail.short_description"></p>

          <!-- Meta Grid -->
          <dl class="grid grid-cols-2 gap-x-4 gap-y-2 text-xs">
            <template x-if="detail.duration_typical_minutes">
              <div class="contents">
                <dt class="text-stone-500">Dauer</dt>
                <dd>
                  <span x-text="detail.duration_min_minutes ? detail.duration_min_minutes + '–' : ''"></span><span x-text="detail.duration_typical_minutes"></span>
                  <span x-text="detail.duration_max_minutes ? '–' + detail.duration_max_minutes : ''"></span> min
                </dd>
              </div>
            </template>
            <template x-if="detail.originator">
              <div class="contents">
                <dt class="text-stone-500">Urheber</dt>
                <dd x-text="detail.originator"></dd>
              </div>
            </template>
            <template x-if="(detail.phases || []).length">
              <div class="contents">
                <dt class="text-stone-500">Phasen</dt>
                <dd x-text="detail.phases.map(p => p.label_de).join(', ')"></dd>
              </div>
            </template>
            <template x-if="(detail.settings || []).length">
              <div class="contents">
                <dt class="text-stone-500">Settings</dt>
                <dd x-text="detail.settings.map(s => s.label_de + ' (' + s.suitability + ')').join(', ')"></dd>
              </div>
            </template>
            <template x-if="(detail.group_sizes || []).length">
              <div class="contents">
                <dt class="text-stone-500">Gruppe</dt>
                <dd x-text="detail.group_sizes.map(g => g.label_de).join(', ')"></dd>
              </div>
            </template>
            <template x-if="(detail.target_audiences || []).length">
              <div class="contents">
                <dt class="text-stone-500">Zielgruppe</dt>
                <dd x-text="detail.target_audiences.map(a => a.label_de).join(', ')"></dd>
              </div>
            </template>
          </dl>

          <!-- Tags + Synonyms -->
          <template x-if="(detail.tags || []).length">
            <div>
              <h3 class="text-xs uppercase tracking-wider text-stone-500 font-medium mb-2">Tags</h3>
              <div class="flex flex-wrap gap-1">
                <template x-for="t in detail.tags" :key="t">
                  <span class="text-[10px] uppercase px-1.5 py-0.5 bg-stone-100 text-stone-600 rounded" x-text="t"></span>
                </template>
              </div>
            </div>
          </template>
          <template x-if="(detail.synonyms || []).length">
            <div>
              <h3 class="text-xs uppercase tracking-wider text-stone-500 font-medium mb-2">Auch bekannt als</h3>
              <p class="text-sm text-stone-600" x-text="detail.synonyms.map(s => s.synonym).join(' · ')"></p>
            </div>
          </template>

          <!-- Steps (Stage 2) -->
          <template x-if="(detail.steps || []).length">
            <div>
              <h3 class="text-xs uppercase tracking-wider text-stone-500 font-medium mb-3">Ablauf</h3>
              <ol class="space-y-3">
                <template x-for="s in detail.steps" :key="s.order_index">
                  <li class="flex gap-3 text-sm">
                    <div class="flex-shrink-0 w-7 h-7 bg-teal-100 text-teal-800 rounded-full flex items-center justify-center text-xs font-semibold" x-text="s.order_index"></div>
                    <div class="flex-1 min-w-0">
                      <div class="flex items-baseline justify-between gap-2">
                        <h4 class="font-medium" x-text="s.label"></h4>
                        <span x-show="s.duration_minutes" class="text-[10px] text-stone-400 whitespace-nowrap" x-text="s.duration_minutes + ' min'"></span>
                      </div>
                      <p class="text-xs text-stone-700 mt-1"><span class="text-stone-400">Trainer:in:</span> <span x-text="s.trainer_action"></span></p>
                      <p class="text-xs text-stone-700 mt-1"><span class="text-stone-400">TN:</span> <span x-text="s.participant_action"></span></p>
                      <p x-show="s.note" class="text-xs text-stone-500 italic mt-1" x-text="s.note"></p>
                    </div>
                  </li>
                </template>
              </ol>
            </div>
          </template>

          <!-- Variations -->
          <template x-if="(detail.variations || []).length">
            <div>
              <h3 class="text-xs uppercase tracking-wider text-stone-500 font-medium mb-3">Varianten</h3>
              <ul class="space-y-2">
                <template x-for="v in detail.variations" :key="v.name">
                  <li class="border-l-2 border-stone-200 pl-3 text-sm">
                    <h4 class="font-medium" x-text="v.name"></h4>
                    <p class="text-xs text-stone-700 mt-0.5" x-text="v.description"></p>
                    <p x-show="v.when_to_use" class="text-xs text-stone-500 italic mt-0.5"><span class="text-stone-400">Wann:</span> <span x-text="v.when_to_use"></span></p>
                  </li>
                </template>
              </ul>
            </div>
          </template>

          <!-- Pitfalls -->
          <template x-if="(detail.pitfalls || []).length">
            <div>
              <h3 class="text-xs uppercase tracking-wider text-stone-500 font-medium mb-3">Stolperfallen</h3>
              <ul class="space-y-2">
                <template x-for="p in detail.pitfalls" :key="p.issue">
                  <li class="text-sm bg-amber-50 border-l-2 border-amber-300 pl-3 py-2 rounded-r">
                    <p class="text-stone-800"><span class="text-amber-700 font-medium">Problem:</span> <span x-text="p.issue"></span></p>
                    <p class="text-stone-700 mt-1"><span class="text-amber-700 font-medium">Gegenmaßnahme:</span> <span x-text="p.countermeasure"></span></p>
                  </li>
                </template>
              </ul>
            </div>
          </template>

          <!-- Sources -->
          <template x-if="(detail.sources || []).length">
            <div>
              <h3 class="text-xs uppercase tracking-wider text-stone-500 font-medium mb-2">Quellen</h3>
              <ul class="space-y-1.5 text-xs">
                <template x-for="s in detail.sources" :key="s.title">
                  <li>
                    <span class="text-stone-400 uppercase text-[10px] mr-1" x-text="s.relation"></span>
                    <span class="font-medium" x-text="s.title"></span>
                    <span x-show="s.author" class="text-stone-600" x-text="' · ' + s.author"></span>
                    <span x-show="s.year" class="text-stone-500" x-text="' · ' + s.year"></span>
                    <a x-show="s.url" :href="s.url" target="_blank" rel="noopener" class="text-teal-700 hover:underline ml-1">↗</a>
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </div>
      </template>
    </article>
  </div>

  <script>
    // ---------------------------------------------------------------
    // catalogApp() — Alpine-Component für die ganze Seite.
    // Nicht modular aufgesplittet; bei dieser Größenordnung (eine Seite,
    // <500 LOC JS) lohnt sich keine Komponenten-Hierarchie.
    // ---------------------------------------------------------------
    function catalogApp() {
      return {
        // Daten
        results: [],
        detail: null,
        refs: { phases: [], settings: [], group_sizes: [], audiences: [], method_types: [] },
        totalCount: 0,

        // UI-State
        query: "",
        searchMode: "hybrid",
        loading: false,
        lastError: "",

        // Filter
        filters: {
          phase: "",
          setting: [],
          group_size: [],
          audience: [],
          method_type: [],
          onlyReviewed: false,
          onlyStage2: false,
        },

        // ----- Bootstrap & API -----

        async bootstrap() {
          // Reference-Daten parallel laden (5 Calls in einem Promise.all),
          // damit die Sidebar in einem Rutsch aufgebaut wird.
          try {
            const [phases, settings, groups, audiences, types, health] = await Promise.all([
              this.api("/reference/phases"),
              this.api("/reference/settings"),
              this.api("/reference/group-sizes"),
              this.api("/reference/target-audiences"),
              this.api("/reference/method-types"),
              this.api("/health"),
            ]);
            this.refs.phases = phases || [];
            this.refs.settings = settings || [];
            this.refs.group_sizes = groups || [];
            this.refs.audiences = audiences || [];
            this.refs.method_types = types || [];
            this.totalCount = (health && health.methods_total) || 0;
          } catch (e) {
            this.lastError = "API nicht erreichbar — läuft uvicorn?";
          }
          // Initial-Liste ohne Filter (zeigt alle).
          await this.runSearch();
        },

        async api(path, params) {
          const url = new URL(path, window.location.origin);
          if (params) {
            for (const [k, v] of Object.entries(params)) {
              if (Array.isArray(v)) v.forEach(item => url.searchParams.append(k, item));
              else if (v !== "" && v !== null && v !== undefined && v !== false) {
                url.searchParams.append(k, v);
              }
            }
          }
          const r = await fetch(url, { method: "GET" });
          if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
          return r.json();
        },

        // ----- Such-Logik -----

        async runSearch() {
          this.loading = true;
          this.lastError = "";
          try {
            // Bei leerem Query: /methods mit Filtern.
            // Bei Query: /search mit Modus + serverseitige Filter werden
            // hier nicht angewandt (search hat sein eigenes Ranking) — wir
            // filtern stattdessen client-seitig nach.
            let rows;
            if (this.query.trim().length >= 2) {
              rows = await this.api("/search", {
                q: this.query.trim(),
                mode: this.searchMode,
                limit: 50,
              });
              rows = this.applyClientFilters(rows);
            } else {
              const params = {
                phase: this.filters.phase || undefined,
                setting: this.filters.setting,
                group_size: this.filters.group_size,
                audience: this.filters.audience,
                method_type: this.filters.method_type,
                limit: 200,
              };
              rows = await this.api("/methods", params);
              rows = this.applyQualityFilters(rows);
            }
            this.results = rows;
          } catch (e) {
            this.lastError = String(e.message || e);
            this.results = [];
          } finally {
            this.loading = false;
          }
        },

        // Wenn /search benutzt wird, müssen Settings/Audience/Type/etc.
        // client-seitig gefiltert werden — der Endpoint hat dafür keine Args.
        applyClientFilters(rows) {
          let out = rows;
          if (this.filters.phase) {
            out = out.filter(m => m.primary_phase_code === this.filters.phase);
          }
          if (this.filters.setting.length) {
            out = out.filter(m => (m.setting_codes || []).some(c => this.filters.setting.includes(c)));
          }
          if (this.filters.method_type.length) {
            out = out.filter(m => (m.method_type_codes || []).some(c => this.filters.method_type.includes(c)));
          }
          // group_size + audience sind in /search-Liste nicht enthalten,
          // also überspringen wir die hier und akzeptieren die Filter-Lücke.
          // (Detail-Click lädt das volle Objekt.)
          return this.applyQualityFilters(out);
        },

        applyQualityFilters(rows) {
          let out = rows;
          if (this.filters.onlyReviewed) {
            out = out.filter(m => m.quality_status === "human_reviewed" || m.quality_status === "expert_verified");
          }
          if (this.filters.onlyStage2) {
            out = out.filter(m => m.stage_2_status === "human_reviewed" || m.stage_2_status === "expert_verified");
          }
          return out;
        },

        resetFilters() {
          this.filters = {
            phase: "", setting: [], group_size: [], audience: [], method_type: [],
            onlyReviewed: false, onlyStage2: false,
          };
        },

        // ----- Detail-Drawer -----

        async openDetail(slug) {
          this.detail = null;
          try {
            const data = await this.api(`/methods/${slug}`);
            this.detail = data;
            // Lock body scroll while drawer open
            document.body.style.overflow = "hidden";
          } catch (e) {
            this.lastError = `Methode nicht ladbar: ${e.message}`;
          }
        },

        closeDetail() {
          this.detail = null;
          document.body.style.overflow = "";
        },
      };
    }
  </script>
</body>
</html>
